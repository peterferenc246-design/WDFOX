<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOX Live Translator API</title>
  <meta name="description" content="FOX Live Translator API — Slovak ↔ German voice translation backend.">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #172033; }
    main { width: min(680px, calc(100% - 40px)); box-sizing: border-box; padding: 36px; border-radius: 18px; background: white; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    code { padding: 3px 7px; border-radius: 6px; background: #eef1f5; }
    .ok { display: inline-block; margin: 12px 0 20px; padding: 7px 12px; border-radius: 999px; background: #e7f7ed; color: #16733a; font-weight: 700; }
    a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      body { background: #11151c; color: #eef2f7; }
      main { background: #1b222d; box-shadow: none; }
      code { background: #293241; }
      .ok { background: #173b27; color: #8ee2ad; }
    }
  </style>
</head>
<body>
  <main>
    <h1>FOX Live Translator</h1>
    <div class="ok">● API deployment is online</div>
    <p>Backend pre mobilnú aplikáciu <strong>FOX Live Translator</strong>.</p>
    <p>Jazykový pár MVP: <strong>Slovenčina ↔ Nemčina</strong>.</p>
    <p>Health check: <a href="/api/health"><code>/api/health</code></a></p>
    <p>Voice translation endpoint: <code>POST /api/translate-voice</code></p>
  </main>
</body>
</html>
