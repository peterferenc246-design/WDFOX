<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOX Live Translator — Voice Test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#f5f7fa;color:#10233f}main{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}h1{margin-top:0}select,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #ccd4df}button{cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.box{background:#f7f9fc;border-radius:12px;padding:14px;margin-top:14px;min-height:44px}.status{font-weight:700;margin-top:12px}label{font-weight:600}small{color:#52657d}</style>
</head>
<body><main>
<h1>FOX Live Translator</h1>
<p>Prvý reálny hlasový test API — <b>Slovenčina ↔ Nemčina</b>.</p>
<div class="row">
<label>Hovorím:
<select id="source"><option value="sk">🇸🇰 Slovenčina</option><option value="de">🇩🇪 Nemčina</option></select></label>
<label>Preložiť do:
<select id="target"><option value="de">🇩🇪 Nemčina</option><option value="sk">🇸🇰 Slovenčina</option></select></label>
</div>
<div class="row"><button id="start">🎤 Začať hovoriť</button><button id="stop" disabled>⏹ Zastaviť a preložiť</button></div>
<div class="status" id="status">Pripravené.</div>
<div class="box"><small>Rozpoznaný text</small><div id="transcript">—</div></div>
<div class="box"><small>Preklad</small><div id="translation">—</div></div>
<audio id="audio" controls style="width:100%;margin-top:14px;display:none"></audio>
<script>
let recorder, chunks=[];
const $=id=>document.getElementById(id);
$('start').onclick=async()=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[]; recorder=new MediaRecorder(stream); recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop()); await translate();};
  recorder.start(); $('start').disabled=true; $('stop').disabled=false; $('status').textContent='🎤 Nahrávam… hovorte teraz.';
 }catch(e){$('status').textContent='❌ Mikrofon nebol povolený: '+e.message}
};
$('stop').onclick=()=>{if(recorder&&recorder.state!=='inactive'){recorder.stop();$('stop').disabled=true;$('status').textContent='⏳ Odosielam zvuk na preklad…'}};
async function translate(){
 const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}), fd=new FormData();
 fd.append('audio',blob,'voice.webm'); fd.append('sourceLanguage',$('source').value); fd.append('targetLanguage',$('target').value); fd.append('speakResult','true');
 try{
  const r=await fetch('/api/translate-voice',{method:'POST',body:fd}); const data=await r.json();
  if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
  $('transcript').textContent=data.transcript||'—'; $('translation').textContent=data.translatedText||'—';
  if(data.audioBase64){$('audio').src='data:'+(data.audioMimeType||'audio/mpeg')+';base64,'+data.audioBase64;$('audio').style.display='block';$('audio').play().catch(()=>{});}
  $('status').textContent='✅ Preklad dokončený.';
 }catch(e){$('status').textContent='❌ '+e.message}
 finally{$('start').disabled=false}
}
</script></main></body></html>
