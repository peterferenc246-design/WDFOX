<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Jahrelange Arbeit - und dann?</title>
  <desc id="desc">Scharfe Dokumentationsgrafik zur Situation rund um den Bürgergeldantrag.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#5b341d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7c2d12" stop-opacity=".25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="185" fill="#050505" fill-opacity=".86"/>
  <rect x="0" y="185" width="640" height="535" fill="#51301e" fill-opacity=".42"/>
  <rect x="640" y="185" width="640" height="535" fill="#101820" fill-opacity=".62"/>
  <path d="M635 185 L690 720 L610 720 Z" fill="#f59e0b" fill-opacity=".18"/>
  <circle cx="640" cy="365" r="170" fill="url(#sun)" opacity=".65"/>

  <!-- stylized German flag -->
  <g opacity=".95" transform="translate(0 185)">
    <path d="M0 40 C100 0 180 20 270 60 L270 145 C165 110 90 92 0 120 Z" fill="#111"/>
    <path d="M0 78 C100 38 180 58 270 98 L270 183 C165 148 90 130 0 158 Z" fill="#c1121f"/>
    <path d="M0 116 C100 76 180 96 270 136 L270 221 C165 186 90 168 0 196 Z" fill="#facc15"/>
  </g>

  <!-- worker -->
  <g transform="translate(120 275)" filter="url(#shadow)">
    <circle cx="95" cy="62" r="48" fill="#d6a06e"/>
    <path d="M42 42 Q95 -6 148 42 L139 60 L52 60 Z" fill="#f59e0b"/>
    <rect x="48" y="108" width="94" height="150" rx="24" fill="#2f353d"/>
    <rect x="25" y="120" width="30" height="130" rx="14" fill="#2f353d"/>
    <rect x="135" y="120" width="30" height="130" rx="14" fill="#2f353d"/>
    <path d="M65 115 L82 245 M125 115 L108 245" stroke="#767e88" stroke-width="10"/>
  </g>

  <!-- center road / Brandenburg Gate silhouette -->
  <g transform="translate(515 260)" opacity=".95">
    <rect x="10" y="70" width="230" height="95" fill="#1f2937"/>
    <rect x="35" y="45" width="180" height="30" fill="#1f2937"/>
    <rect x="50" y="10" width="150" height="38" fill="#1f2937"/>
    <rect x="35" y="165" width="24" height="120" fill="#1f2937"/>
    <rect x="82" y="165" width="24" height="120" fill="#1f2937"/>
    <rect x="129" y="165" width="24" height="120" fill="#1f2937"/>
    <rect x="176" y="165" width="24" height="120" fill="#1f2937"/>
    <path d="M128 2 l12 -22 l12 22 z" fill="#1f2937"/>
  </g>
  <path d="M585 720 L655 405 L725 720 Z" fill="#171717" opacity=".82"/>
  <path d="M655 415 L655 720" stroke="#f8b84e" stroke-width="14" stroke-dasharray="34 28"/>

  <!-- Jobcenter building -->
  <g transform="translate(865 235)">
    <polygon points="0,0 415,-38 415,250 0,250" fill="#cfd5da"/>
    <rect x="34" y="54" width="350" height="95" rx="6" fill="#f5f5f5"/>
    <text x="52" y="117" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#1f2937">jobcenter</text>
    <circle cx="347" cy="98" r="29" fill="#d62828"/>
    <path d="M334 84 l28 14 l-28 14 z" fill="#fff"/>
  </g>

  <!-- seated person silhouette -->
  <g transform="translate(840 330)" filter="url(#shadow)">
    <circle cx="150" cy="60" r="47" fill="#b77a58"/>
    <path d="M105 110 q45 -28 90 0 l32 175 h-154z" fill="#25282d"/>
    <path d="M115 38 q35 -32 72 0" stroke="#202020" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M182 100 q34 28 54 72" stroke="#25282d" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M220 165 l65 -35" stroke="#25282d" stroke-width="28" stroke-linecap="round"/>
    <rect x="225" y="118" width="145" height="92" transform="rotate(-10 225 118)" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="245" y="156" transform="rotate(-10 245 156)" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#111">GUTSCHEIN</text>
    <text x="250" y="194" transform="rotate(-10 250 194)" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900" fill="#d62828">25 EUR</text>
  </g>

  <!-- headline -->
  <text x="640" y="67" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="67" font-weight="900" fill="#fff" stroke="#000" stroke-width="2" paint-order="stroke" letter-spacing="1">JAHRELANG ARBEIT - <tspan fill="#ffd21f">UND DANN?</tspan></text>
  <text x="640" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#fff" stroke="#000" stroke-width="2" paint-order="stroke">STEUERN GEZAHLT, DAS SYSTEM MITFINANZIERT -</text>
  <text x="640" y="159" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#ffd21f" stroke="#000" stroke-width="2" paint-order="stroke">UND IN DER NOT ALLEIN GELASSEN?</text>

  <!-- left checklist -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#fff" stroke="#000" stroke-width="1" paint-order="stroke">
    <text x="38" y="390"><tspan fill="#47ff4b" font-size="34">✓</tspan> GEARBEITET</text>
    <text x="38" y="430"><tspan fill="#47ff4b" font-size="34">✓</tspan> STEUERN GEZAHLT</text>
    <text x="38" y="470"><tspan fill="#47ff4b" font-size="34">✓</tspan> INS SYSTEM EINGEZAHLT</text>
    <text x="38" y="510"><tspan fill="#47ff4b" font-size="34">✓</tspan> KEINE LEISTUNGEN BEZOGEN</text>
    <text x="38" y="550"><tspan fill="#47ff4b" font-size="34">✓</tspan> STUDIUM AUS EIGENEN ERSPARNISSEN</text>
  </g>

  <!-- bottom left amount -->
  <g transform="translate(95 575) rotate(-2)" filter="url(#shadow)">
    <rect width="350" height="115" rx="7" fill="#d5d1c7" stroke="#555" stroke-width="3"/>
    <text x="175" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#161616">STEUERN</text>
    <text x="175" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="900" fill="#161616">SOZIALABGABEN</text>
    <text x="175" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#161616">130.000 EUR</text>
  </g>

  <!-- middle labels -->
  <text x="570" y="612" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="32" font-weight="900" font-style="italic" fill="#ffd21f" stroke="#111" stroke-width="2" paint-order="stroke">BEITRAG</text>
  <text x="586" y="649" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="32" font-weight="900" font-style="italic" fill="#ffd21f" stroke="#111" stroke-width="2" paint-order="stroke">ZUM</text>
  <text x="566" y="686" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="32" font-weight="900" font-style="italic" fill="#ffd21f" stroke="#111" stroke-width="2" paint-order="stroke">LAND</text>

  <text x="720" y="615" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="33" font-weight="900" fill="#fff" stroke="#111" stroke-width="2" paint-order="stroke" transform="rotate(-5 720 615)">WENN ICH</text>
  <text x="705" y="655" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="33" font-weight="900" fill="#fff" stroke="#111" stroke-width="2" paint-order="stroke" transform="rotate(-5 705 655)">HILFE BRAUCHE</text>

  <!-- right checklist -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#fff" stroke="#000" stroke-width="1" paint-order="stroke">
    <text x="1028" y="410"><tspan fill="#ff2b2b" font-size="34">✕</tspan> MONATELANGES WARTEN</text>
    <text x="1028" y="450"><tspan fill="#ff2b2b" font-size="34">✕</tspan> NUR 25 EUR GUTSCHEINE</text>
    <text x="1028" y="490"><tspan fill="#ff2b2b" font-size="34">✕</tspan> VERWEIS AUF</text>
    <text x="1067" y="520">EHEMALIGE EHEFRAU</text>
    <text x="1028" y="560"><tspan fill="#ff2b2b" font-size="34">✕</tspan> LANGE WEGE (20 KM)</text>
    <text x="1028" y="600"><tspan fill="#ff2b2b" font-size="34">✕</tspan> KEINE KLARE ENTSCHEIDUNG</text>
  </g>
</svg>