<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenStreetMap – Rammelkam 2, 84036 Kumhausen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { background: #e7edf0; }
    #map { position: relative; }
    #map-fallback { position: absolute; top: 12px; left: 12px; color: #1f2a44; font: 14px system-ui,sans-serif; }
    .contact-pin {
      background: #f36a0a;
      border: 3px solid white;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.45);
      transform: rotate(-45deg);
      width: 22px;
      height: 22px;
      box-sizing: border-box;
    }
    .contact-pin-icon { background: transparent; border: 0; }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="OpenStreetMap – Rammelkam 2, 84036 Kumhausen">
    <a id="map-fallback" href="https://www.openstreetmap.org/way/525409935" target="_blank" rel="noopener noreferrer">OpenStreetMap ↗</a>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script>
    // Verified address: OSM building way 525409935 (Rammelkam 2).
    if (window.L) {
      const address = 'Rammelkam 2, 84036 Kumhausen';
      const location = [48.489757, 12.154210];
      const map = L.map('map', { scrollWheelZoom: false }).setView(location, 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
      }).addTo(map);
      const icon = L.divIcon({
        className: 'contact-pin-icon',
        html: '<div class="contact-pin"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 22]
      });
      L.marker(location, { icon, title: address, alt: address }).addTo(map);
      map.attributionControl.setPrefix('<a href="https://leafletjs.com/" target="_blank" rel="noopener noreferrer">Leaflet</a>');
      document.getElementById('map-fallback').remove();
    }
  </script>
</body>
</html>
