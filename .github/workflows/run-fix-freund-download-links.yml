name: Fix Freund download links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fix-freund-download-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Freund download links
        run: python3 .github/scripts/fix_freund_download_links.py
      - name: Commit fix
        run: |
          if git diff --quiet -- public/jobcenter-poster-fix.js; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git commit -m 'Show exactly three Freund attachment download links'
          git push origin HEAD:main
