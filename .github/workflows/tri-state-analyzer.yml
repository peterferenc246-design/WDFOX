name: Patch analyzer tri-state
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          marker="const qs=new URLSearchParams(location.search),langs=['de','en','sk','fr','hr','pl','it','es','sv'],L=langs.includes(qs.get('lang'))?qs.get('lang'):'de';"
          inject=marker+"\nlet analyzerSourceState='unknown';\nconst analyzerHeadDependent=['FOX Crawlability','Canonical','Schema.org / JSON-LD','Meta-Titel','Meta title','Meta-Titel','Meta-Beschreibung','Meta description','Open Graph / Meta','X / Twitter Cards','Meta Pixel','Hreflang','Favicon','Mobile / Viewport','Mobile / viewport','Noindex','fbevents.js','fbq()','Pixel-Initialisierung','Pixel init','PageView','Consent / GDPR-Signal','Consent / GDPR signal'];\nfunction applyAnalyzerTriState(){const root=document.getElementById('result');if(!root||analyzerSourceState==='full')return;const unknownText=(T[L]&&T[L].unavailable)||'Unavailable';root.querySelectorAll('.card').forEach(card=>{const title=(card.querySelector('strong')?.textContent||'').trim();if(!analyzerHeadDependent.includes(title))return;card.classList.remove('bad','ok');card.classList.add('warn');const p=card.querySelector('p');if(p)p.textContent='— '+unknownText+' · HTML source could not be reliably verified';});const score=root.querySelector('.score strong');if(score){const cards=[...root.querySelectorAll('.card')].filter(c=>!c.classList.contains('warn'));const pass=cards.filter(c=>c.classList.contains('ok')).length;const fail=cards.filter(c=>c.classList.contains('bad')).length;const total=pass+fail;score.textContent=total?Math.round(pass/total*100)+'/100':'—';}}\nconst analyzerResultObserver=new MutationObserver(()=>applyAnalyzerTriState());analyzerResultObserver.observe(document.documentElement,{subtree:true,childList:true});"
          if marker not in s: raise SystemExit('top marker not found')
          s=s.replace(marker,inject,1)
          old="let head0=await jinaHead(target);"
          new=old+" analyzerSourceState=/<html\\b/i.test(String(head0.content||''))&&/<head\\b/i.test(String(head0.content||''))&&/<body\\b/i.test(String(head0.content||''))?'full':'unknown';"
          if old not in s: raise SystemExit('head marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make analyzer checks tri-state'
          git push
