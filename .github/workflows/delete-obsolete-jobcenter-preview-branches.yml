name: Delete obsolete Jobcenter preview branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-obsolete-jobcenter-preview-branches.yml'

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete preview branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete jobcenter-preproduction jobcenter-predproduction
