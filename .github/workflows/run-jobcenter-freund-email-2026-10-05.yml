name: Publish Freund email on Jobcenter page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-jobcenter-freund-email-2026-10-05.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Jobcenter Freund email patch
        run: python3 .github/scripts/add_jobcenter_freund_email_2026_10_05.py
      - name: Commit source update
        run: |
          if git diff --quiet -- public/jobcenter-poster-fix.js; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git commit -m 'Publish 05.10.2026 Freund email on Jobcenter page'
          git push origin HEAD:main
