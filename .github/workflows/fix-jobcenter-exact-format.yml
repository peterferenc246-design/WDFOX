name: Fix Jobcenter exact message format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-exact-format.yml'

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact 04.10 Jobcenter message layout
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit exact format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Format 04.10 Jobcenter message exactly as requested'
          git push
