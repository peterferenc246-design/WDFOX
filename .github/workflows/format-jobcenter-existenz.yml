name: Format Jobcenter Existenz message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-jobcenter-existenz.yml'

permissions:
  contents: write

jobs:
  format-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Jobcenter message layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('            <div class="outlook-view-body" style="padding:16px 18px;line-height:1.45;text-align:justify;text-justify:inter-word;hyphens:auto">')
          first_main = s.index('              <p style="margin:0 0 4px">Sehr geehrte Damen und Herren,</p>', start)

          prefix = '''            <div class="outlook-view-body" style="padding:10px 14px;line-height:1.32;text-align:justify;text-justify:inter-word;hyphens:auto;white-space:normal">
              <div style="margin:0;padding:0">
                <div style="font-weight:700;margin:0 0 6px">postfachnachricht-04.10.2026 15_21</div>
                <p style="margin:0 0 4px">Sehr geehrte Damen und Herren, anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>
                <p style="margin:0 0 4px">Mit freundlichen Grüßen</p>
                <p style="margin:0 0 6px">Peter Ferenc</p>
                <div style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin:0 0 8px;line-height:1.25">
                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a>
                  <a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>
                </div>
                <hr style="border:0;border-top:1px solid #8f8f8f;margin:6px 0 8px">
              </div>
'''

          s = s[:start] + prefix + s[first_main:]

          # Remove obsolete dynamic loader call for this block, since the short message is now explicitly formatted.
          old = "    var existenzPdfText = section.querySelector('#existenz-postfach-pdf-text');\n    if (existenzPdfText) loadPdfText(existenzPdfText, EXISTENZ_POSTFACH_PDF_URL);\n"
          s = s.replace(old, '')

          # Remove the old scoped style rules that targeted the deleted dynamic PDF-text block and prevent inherited pre-wrap gaps.
          s = s.replace('#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding-top:0!important;display:block!important;white-space:normal!important}', '#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding:10px 14px!important;display:block!important;white-space:normal!important;line-height:1.32!important}')
          s = s.replace('#jobcenter-existenz-message-2026-10-04 .outlook-view-body>div:first-child{margin-top:0!important;padding-top:0!important;margin-bottom:2px!important}', '#jobcenter-existenz-message-2026-10-04 .outlook-view-body>div:first-child{margin:0!important;padding:0!important}')
          s = s.replace('#jobcenter-existenz-message-2026-10-04 [data-wdfox-reference-links="1"]{margin:0 0 2px!important;gap:0!important;line-height:1.2!important}\n', '')
          s = s.replace('#jobcenter-existenz-message-2026-10-04 #existenz-postfach-pdf-text{margin:0 0 2px!important;padding:0!important;line-height:1.25!important}\n', '')
          s = s.replace('#jobcenter-existenz-message-2026-10-04 #existenz-postfach-pdf-text p{margin:0 0 2px!important;padding:0!important;min-height:0!important}\n', '')
          s = s.replace('#jobcenter-existenz-message-2026-10-04 #existenz-postfach-pdf-text p:last-child{margin-bottom:2px!important}\n', '')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Format 04.10 Jobcenter message exactly as requested'
          git push
