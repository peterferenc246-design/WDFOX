name: Fix analyzer freeze
on:
  push:
    paths:
      - '.github/workflows/fix-analyzer-freeze.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MutationObserver loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          old="function applyAnalyzerTriState(){const root=document.getElementById('result');if(!root||analyzerSourceState==='full')return;const unknownText=(T[L]&&T[L].unavailable)||'Unavailable';root.querySelectorAll('.card').forEach(card=>{const title=(card.querySelector('strong')?.textContent||'').trim();if(!analyzerHeadDependent.includes(title))return;card.classList.remove('bad','ok');card.classList.add('warn');const p=card.querySelector('p');if(p)p.textContent='— '+unknownText+' · HTML source could not be reliably verified';});const score=root.querySelector('.score strong');if(score){const cards=[...root.querySelectorAll('.card')].filter(c=>!c.classList.contains('warn'));const pass=cards.filter(c=>c.classList.contains('ok')).length;const fail=cards.filter(c=>c.classList.contains('bad')).length;const total=pass+fail;score.textContent=total?Math.round(pass/total*100)+'/100':'—';}}"
          new="function applyAnalyzerTriState(){const root=document.getElementById('result');if(!root||analyzerSourceState==='full'||root.dataset.tristateApplied==='1')return;const allCards=[...root.querySelectorAll('.card')];if(!allCards.length)return;const unknownText=(T[L]&&T[L].unavailable)||'Unavailable';let changed=false;allCards.forEach(card=>{const title=(card.querySelector('strong')?.textContent||'').trim();if(!analyzerHeadDependent.includes(title))return;card.classList.remove('bad','ok');card.classList.add('warn');const p=card.querySelector('p');const text='— '+unknownText+' · HTML source could not be reliably verified';if(p&&p.textContent!==text)p.textContent=text;changed=true;});const score=root.querySelector('.score strong');if(score){const cards=allCards.filter(c=>!c.classList.contains('warn'));const pass=cards.filter(c=>c.classList.contains('ok')).length;const fail=cards.filter(c=>c.classList.contains('bad')).length;const total=pass+fail;score.textContent=total?Math.round(pass/total*100)+'/100':'—';}if(changed)root.dataset.tristateApplied='1';}"
          if old not in s:
              raise SystemExit('tri-state function not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git diff --cached --quiet || git commit -m 'fix: prevent analyzer MutationObserver freeze'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-analyzer-freeze.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary analyzer freeze workflow'
          git push
