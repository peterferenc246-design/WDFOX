name: One-time Tawk hard language reload patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_tawk_hard_language_reload.py'
      - '.github/workflows/patch-tawk-hard-language-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch_tawk_hard_language_reload.py
      - name: Commit loader fix
        run: |
          git config user.name "WDFOX Tawk Bot"
          git config user.email "actions@github.com"
          git add public/tawk-language-loader.js
          git commit -m "Isolate Tawk sessions between languages"
          git push origin main
