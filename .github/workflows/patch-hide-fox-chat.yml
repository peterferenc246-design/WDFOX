name: One-time FOX launcher visibility patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_hide_fox_when_chat_open.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply FOX launcher patch
        run: python scripts/patch_hide_fox_when_chat_open.py

      - name: Commit launcher fix
        run: |
          git config user.name "WDFOX Tawk Bot"
          git config user.email "actions@github.com"
          git add public/tawk-language-loader.js
          git commit -m "Hide FOX launcher while Tawk chat is open"
          git push origin main
