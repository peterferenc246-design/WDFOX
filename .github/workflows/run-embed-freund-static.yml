name: Embed Freund email statically on Jobcenter page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-embed-freund-static.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed Freund email into static source
        run: python3 .github/scripts/embed_freund_email_static.py
      - name: Commit static embed
        run: |
          if git diff --quiet -- public/jobcenter-source.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-source.html
          git commit -m 'Embed Daniel Freund email and three downloads directly on Jobcenter page'
          git push origin HEAD:main
