name: Diagnose myTime HTML
on:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch direct HTML
        run: |
          curl -fsSL --max-time 30 https://www.mytime.de/ -o /tmp/direct.html
          python - <<'PY'
          from pathlib import Path
          h=Path('/tmp/direct.html').read_text(errors='ignore')
          print('DIRECT bytes:',len(h))
          for x in ['<html','<head','<meta name="viewport"','rel="canonical"','application/ld+json','rel="icon"','hreflang','<title>','name="description"']:
              print('DIRECT',x, bool(x.lower() in h.lower()))
          PY
      - name: Fetch Jina HTML
        run: |
          curl -fsSL --max-time 60 -H 'X-Respond-With: html' -H 'X-Engine: browser' -H 'X-Respond-Timing: html' -H 'X-No-Cache: true' https://r.jina.ai/https://www.mytime.de/ -o /tmp/jina.txt
          python - <<'PY'
          from pathlib import Path
          h=Path('/tmp/jina.txt').read_text(errors='ignore')
          print('JINA bytes:',len(h))
          print('JINA prefix:',h[:120].replace('\n',' '))
          for x in ['<html','<head','<meta name="viewport"','rel="canonical"','application/ld+json','rel="icon"','hreflang','<title>','name="description"']:
              print('JINA',x, bool(x.lower() in h.lower()))
          PY
