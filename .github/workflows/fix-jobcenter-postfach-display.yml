name: Fix Jobcenter Postfach display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-postfach-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore requested Jobcenter display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/jobcenter-poster-fix.js')
          text = path.read_text(encoding='utf-8')

          # Remove the two links the user explicitly asked to remove.
          start = text.find('              <div data-wdfox-email-links="1"')
          if start != -1:
              end = text.find('              </div>', start)
              if end != -1:
                  text = text[:start] + text[end + len('              </div>\n'):]

          # Keep only the main existence PDF button; remove the postfach PDF button.
          text = text.replace('                <a href="${EXISTENZ_POSTFACH_PDF_URL}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:10px 14px;border:1px solid #1877F2;border-radius:8px;background:#fff;color:#0b57d0;font-weight:700;text-decoration:none">📄 postfachnachricht-04.10.2026 15_21 öffnen</a>\n', '')

          # Correct the visible PDF-text heading exactly as requested.
          text = text.replace('Text aus dem Original-PDF „postfachnachricht-04.10.2026 15_21“', 'postfachnachricht-04.10.2026 15_21')
          text = text.replace('Text aus dem Original-PDF „postfachnachricht-04.10.2026 15_21_existenz.pdf“', 'postfachnachricht-04.10.2026 15_21')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit Jobcenter display fix
        shell: bash
        run: |
          if git diff --quiet -- public/jobcenter-poster-fix.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git commit -m 'Restore Jobcenter postfach display'
          git push
