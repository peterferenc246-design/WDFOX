name: Apply Attention Grabber enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply requested visual changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/site.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* WDFOX Attention Grabber: requested side emojis and white-background cleanup */'
          if marker not in text:
              text += '''\n\n/* WDFOX Attention Grabber: requested side emojis and white-background cleanup */\n#fox-tawk-button .fox-tawk-attention{isolation:isolate!important;}\n#fox-tawk-button .fox-attention-svg image{mix-blend-mode:multiply!important;}\n#fox-tawk-button .fox-tawk-attention::before,#fox-tawk-button .fox-tawk-attention::after{position:absolute!important;top:78px!important;z-index:3!important;display:block!important;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important;font-size:27px!important;line-height:1!important;pointer-events:none!important;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))!important;}\n#fox-tawk-button .fox-tawk-attention::before{content:"✍"!important;left:18px!important;transform:rotate(-10deg)!important;}\n#fox-tawk-button .fox-tawk-attention::after{content:"🤝"!important;right:18px!important;transform:rotate(10deg)!important;}\n@media(max-width:700px){#fox-tawk-button .fox-tawk-attention::before,#fox-tawk-button .fox-tawk-attention::after{top:78px!important;font-size:27px!important;}#fox-tawk-button .fox-tawk-attention::before{left:18px!important;}#fox-tawk-button .fox-tawk-attention::after{right:18px!important;}}\n'''
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit visual changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/site.css
          git commit -m "Add Attention Grabber side emojis and remove white background" || exit 0
          git push
      - name: Remove temporary preview
        run: |
          if [ -f deploy.yml.attention-preview ]; then
            rm -f deploy.yml.attention-preview
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A deploy.yml.attention-preview
            git commit -m "Remove temporary Attention Grabber preview" || exit 0
            git push
          fi
