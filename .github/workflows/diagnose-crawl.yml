name: Diagnose crawlability code
on:
  push:
    paths:
      - '.github/workflows/diagnose-crawl.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture analyzer snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/analyzer.astro').read_text()
          out=[]
          for term in ['is-crawlable','Promise.all','function card','pagespeed','crawlMetric']:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append(f'### {term} @ {i}\n{s[max(0,i-500):i+1200]}\n')
                  pos=i+len(term)
                  if len(out)>30: break
          Path('crawl-diagnostic.txt').write_text('\n'.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crawl-diagnostic.txt
          git commit -m 'chore: add crawlability diagnostic' || true
          git push
          rm -f .github/workflows/diagnose-crawl.yml
          git add .github/workflows/diagnose-crawl.yml
          git commit -m 'chore: remove crawlability diagnostic workflow' || true
          git push || true
