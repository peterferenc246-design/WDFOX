name: Group Freund with 05.10 messages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-group-freund-with-2026-10-05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Group both 05.10 messages
        run: python3 .github/scripts/group_freund_with_2026_10_05_jobcenter.py
      - name: Commit change
        run: |
          if git diff --quiet -- public/jobcenter-source.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-source.html
          git commit -m 'Group both 05.10.2026 messages in one Jobcenter day block'
          git push origin HEAD:main
