name: One-time FOX call routing migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-call-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/patch_call_routing.py

      - name: Commit changes
        run: |
          git config user.name "WDFOX Routing Bot"
          git config user.email "actions@github.com"
          git add src/components/FoxLiveTranslator.astro src/components/FoxGeminiAudioBridge.astro
          git commit -m "Complete public call routing to online PC or mobile"
          git push origin main
