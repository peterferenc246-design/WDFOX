name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install native Tawk widget only
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {
              'sk': '1k1b9121q',
              'de': '1k1bb2aln',
              'en': '1k1bb9ast',
              'hr': '1k1bjvbjq',
              'fr': '1k1blk6o4',
              'it': '1k1bovo5t',
              'pl': '1k1bp5qda',
              'es': '1k1bp6lk5',
              'sv': '1k1bpdngj',
          }

          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>.*?embed\.tawk\.to/6a951d52c3c46c344587662a.*?</script>', re.I | re.S),
              re.compile(r'<script[^>]*>\s*\(function\(\)\{\s*var PROPERTY_ID=["\']6a951d52c3c46c344587662a["\'];.*?</script>', re.I | re.S),
              re.compile(r'<style[^>]*id=["\']fox-tawk-attention-style["\'][^>]*>.*?</style>\s*<[^>]*id=["\']fox-tawk-attention["\'][^>]*>.*?</[^>]+>\s*<script[^>]*>.*?</script>', re.I | re.S),
          ]

          def native_snippet(widget_id):
              return f'''<script type="text/javascript">
          var Tawk_API=Tawk_API||{{}},Tawk_LoadStart=new Date();
          (function(){{
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            s1.src='https://embed.tawk.to/{PROPERTY_ID}/{widget_id}';
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
          }})();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)
              lang_match = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (lang_match.group(1).lower().split('-')[0].split('_')[0] if lang_match else 'sk')
              widget_id = WIDGETS.get(lang)
              if widget_id and '</body>' in text:
                  text = text.replace('</body>', native_snippet(widget_id) + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live www.foxprof.club serves the native Tawk widget
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            echo "Live verification attempt ${attempt}: ${url}"
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/1.0' "$url" || true)"
            if grep -q 'embed.tawk.to/6a951d52c3c46c344587662a/1k1b9121q' <<<"$html" && ! grep -q 'fox-tawk-attention' <<<"$html" && ! grep -q 'tawk-attention-click-fix' <<<"$html"; then
              echo 'LIVE_TAWK_NATIVE=OK'
              echo 'LIVE_TAWK_WIDGET=1k1b9121q'
              exit 0
            fi
            echo 'Expected clean native Tawk widget not yet visible from the custom domain.'
            sleep 8
          done
          echo 'LIVE_TAWK_NATIVE=FAIL'
          echo 'The custom domain is not serving the clean native Tawk artifact.'
          exit 1
