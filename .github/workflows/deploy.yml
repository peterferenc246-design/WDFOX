name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Jobcenter AOK evidence PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          from pypdf import PdfReader, PdfWriter

          source = Path('privat/postfachnachricht-03.10.2026 09_30.pdf')
          image_path = Path('privat/Gutschein.jpg')
          output = Path('public/jobcenter/postfachnachricht-03.10.2026 09_30.pdf')

          if not source.is_file():
              raise SystemExit(f'Missing source PDF: {source}')
          if not image_path.is_file():
              raise SystemExit(f'Missing Gutschein image: {image_path}')

          output.parent.mkdir(parents=True, exist_ok=True)

          with Image.open(image_path) as img:
              img = ImageOps.exif_transpose(img).convert('RGB')
              image_pdf = BytesIO()
              img.save(image_pdf, format='PDF', resolution=150.0)
              image_pdf.seek(0)

              source_reader = PdfReader(str(source))
              image_reader = PdfReader(image_pdf)
              writer = PdfWriter()
              for page in source_reader.pages:
                  writer.add_page(page)
              for page in image_reader.pages:
                  writer.add_page(page)

              with output.open('wb') as fh:
                  writer.write(fh)

          merged = PdfReader(str(output))
          expected_pages = len(PdfReader(str(source)).pages) + 1
          if len(merged.pages) != expected_pages:
              raise SystemExit(f'Unexpected page count: {len(merged.pages)} != {expected_pages}')
          if output.stat().st_size <= source.stat().st_size:
              raise SystemExit('Generated PDF is unexpectedly not larger than the source PDF')

          print(f'Generated {output} with {len(merged.pages)} pages')
          PY

      - name: Build Astro site
        run: pnpm run build

      - name: Install approved production Tawk package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ.get("GITHUB_SHA", "production")

          legacy_ui = re.compile(
              r'<style\b[^>]*id=["\']fox-tawk-button-style["\'][^>]*>.*?</style\s*>\s*'
              r'<div\b[^>]*id=["\']fox-tawk-button["\'][^>]*>.*?</div\s*>\s*'
              r'<script\b[^>]*id=["\']fox-tawk-lazy["\'][^>]*>.*?</script\s*>',
              re.I | re.S,
          )
          external_tawk = re.compile(
              r'<script\b[^>]*src=["\'][^"\']*(?:embed\.tawk\.to|tawk-language-loader\.js|tawk-native-force\.js|tawk-avatar-fix\.js|tawk-preview-[^"\']+\.js)[^"\']*["\'][^>]*>\s*</script\s*>',
              re.I | re.S,
          )
          inline_scripts = re.compile(r'<script\b[^>]*>.*?</script\s*>', re.I | re.S)

          def clean(text: str) -> str:
              text = legacy_ui.sub('', text)
              text = external_tawk.sub('', text)

              def keep(match):
                  block = match.group(0)
                  markers = (
                      'embed.tawk.to',
                      'Tawk_API',
                      'fox-tawk-launcher',
                      'fox-tawk-button',
                      'tawk-language-loader',
                      'tawk-native-force',
                      'tawk-avatar-fix',
                      'tawk-preview-',
                  )
                  return '' if any(marker in block for marker in markers) else block

              return inline_scripts.sub(keep, text)

          avatar_exists = Path('dist/tawk-avatar-fix.js').is_file()
          evidence_exists = Path('dist/jobcenter-vodafone-evidence.js').is_file()
          poster_fix_exists = Path('dist/jobcenter-poster-fix.js').is_file()
          snippet = (
              f'<script id="fox-tawk-language-loader" src="/tawk-language-loader.js?v={sha}"></script>\n'
              f'<script id="fox-tawk-native-force" src="/tawk-native-force.js?v={sha}"></script>'
          )
          if avatar_exists:
              snippet += f'\n<script id="fox-tawk-avatar-fix" src="/tawk-avatar-fix.js?v={sha}"></script>'
          if evidence_exists:
              snippet += f'\n<script id="wdfox-jobcenter-vodafone-evidence" src="/jobcenter-vodafone-evidence.js?v={sha}"></script>'
          if poster_fix_exists:
              snippet += f'\n<script id="wdfox-jobcenter-poster-fix" src="/jobcenter-poster-fix.js?v={sha}"></script>'

          files = list(Path('dist').rglob('*.html'))
          if not files:
              raise SystemExit('No built HTML files found in dist')

          for path in files:
              text = clean(path.read_text(encoding='utf-8'))
              if '</body>' not in text:
                  raise SystemExit(f'Missing </body> in {path}')
              text = text.replace('</body>', snippet + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')

          for required in ('dist/tawk-language-loader.js', 'dist/tawk-native-force.js', 'dist/jobcenter-vodafone-evidence.js', 'dist/jobcenter-poster-fix.js'):
              if not Path(required).is_file():
                  raise SystemExit(f'Missing production asset: {required}')
          PY

      - name: Validate production Tawk wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/tawk-language-loader.js
          test -s dist/tawk-native-force.js
          test -s dist/jobcenter-vodafone-evidence.js
          test -s dist/jobcenter-poster-fix.js
          grep -R -q 'id="fox-tawk-language-loader"' dist --include='*.html'
          grep -R -q 'id="fox-tawk-native-force"' dist --include='*.html'
          grep -R -q 'id="wdfox-jobcenter-vodafone-evidence"' dist --include='*.html'
          grep -R -q 'id="wdfox-jobcenter-poster-fix"' dist --include='*.html'
          grep -q 'Tawk_API.endChat' dist/tawk-language-loader.js
          if grep -F -q '#fixed-lang-layer a.language-flag[data-language]' dist/tawk-language-loader.js; then
            echo 'Blocked duplicate production language-click handler'
            exit 1
          fi
          if grep -q 'Tawk_API.switchWidget' dist/tawk-language-loader.js; then
            echo 'Blocked same-session Tawk widget switching in production build'
            exit 1
          fi
          if [[ -f dist/tawk-avatar-fix.js ]]; then
            grep -R -q 'id="fox-tawk-avatar-fix"' dist --include='*.html'
            grep -q 'wdfox-tawk-trigger-avatar-fix' dist/tawk-avatar-fix.js
          fi
          if grep -R -q 'id="fox-tawk-button"' dist --include='*.html'; then
            echo 'Legacy fox-tawk-button still present in production build'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live approved Tawk package
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          loader_url="https://www.foxprof.club/tawk-language-loader.js?v=${GITHUB_SHA}"
          avatar_url="https://www.foxprof.club/tawk-avatar-fix.js?v=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5 6; do
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/4.1' "$url" || true)"
            loader="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/4.1' "$loader_url" || true)"
            base_ok=false
            if grep -q 'id="fox-tawk-language-loader"' <<<"$html" \
              && grep -q '/tawk-language-loader.js' <<<"$html" \
              && grep -q 'id="fox-tawk-native-force"' <<<"$html" \
              && grep -q '/tawk-native-force.js' <<<"$html" \
              && ! grep -q 'id="fox-tawk-button"' <<<"$html" \
              && grep -q 'Tawk_API.endChat' <<<"$loader" \
              && ! grep -F -q '#fixed-lang-layer a.language-flag[data-language]' <<<"$loader" \
              && ! grep -q 'Tawk_API.switchWidget' <<<"$loader"; then
              base_ok=true
            fi
            if [[ "$base_ok" == "true" ]]; then
              if grep -q 'id="fox-tawk-avatar-fix"' <<<"$html"; then
                avatar="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/4.1' "$avatar_url" || true)"
                grep -q 'wdfox-tawk-trigger-avatar-fix' <<<"$avatar" || { sleep 8; continue; }
              fi
              echo 'LIVE_APPROVED_TAWK_PACKAGE=OK'
              exit 0
            fi
            sleep 8
          done
          echo 'LIVE_APPROVED_TAWK_PACKAGE=FAIL'