name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install desktop Attention Grabber and native Tawk chat
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {
              'sk': '1k1b9121q', 'de': '1k1bb2aln', 'en': '1k1bb9ast',
              'hr': '1k1bjvbjq', 'fr': '1k1blk6o4', 'it': '1k1bovo5t',
              'pl': '1k1bp5qda', 'es': '1k1bp6lk5', 'sv': '1k1bpdngj'
          }
          LAUNCHER_COPY = {
              'sk': {'attention': 'Som tu pre vás!', 'open': 'Otvoriť živý chat'},
              'de': {'attention': 'Ich bin für Sie da!', 'open': 'Live-Chat öffnen'},
              'en': {'attention': 'I am here for you!', 'open': 'Open live chat'},
              'hr': {'attention': 'Tu sam za vas!', 'open': 'Otvori razgovor uživo'},
              'fr': {'attention': 'Je suis là pour vous !', 'open': 'Ouvrir le chat en direct'},
              'it': {'attention': 'Sono qui per te!', 'open': 'Apri la chat dal vivo'},
              'pl': {'attention': 'Jestem tu dla Ciebie!', 'open': 'Otwórz czat na żywo'},
              'es': {'attention': '¡Estoy aquí para ti!', 'open': 'Abrir chat en vivo'},
              'sv': {'attention': 'Jag finns här för dig!', 'open': 'Öppna livechatten'}
          }

          old_ui_re = re.compile(
              r'<style\b[^>]*id=["\']fox-tawk-button-style["\'][^>]*>.*?</style\s*>\s*'
              r'<div\b[^>]*id=["\']fox-tawk-button["\'][^>]*>.*?</div\s*>\s*'
              r'<script\b[^>]*id=["\']fox-tawk-lazy["\'][^>]*>.*?</script\s*>',
              re.I | re.S)
          tawk_src_re = re.compile(
              r'<script\b[^>]*src=["\'][^"\']*tawk[^"\']*["\'][^>]*>\s*</script\s*>',
              re.I | re.S)
          inline_script_re = re.compile(r'<script\b[^>]*>.*?</script\s*>', re.I | re.S)

          def clean(text):
              text = old_ui_re.sub('', text)
              text = tawk_src_re.sub('', text)
              def keep(match):
                  block = match.group(0)
                  if 'embed.tawk.to' in block or 'Tawk_API' in block or 'tawk-language-loader' in block:
                      return ''
                  return block
              return inline_script_re.sub(keep, text)


          def snippet(lang):
              copy = LAUNCHER_COPY[lang]
              return f'''<style id="fox-tawk-launcher-style">
          #fox-tawk-launcher{{position:fixed!important;top:auto!important;left:auto!important;right:18px!important;bottom:18px!important;margin:0!important;z-index:2147483647!important;width:250px;height:174px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto!important;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));transition:transform .18s ease;touch-action:manipulation;isolation:isolate}}
          #fox-tawk-launcher:hover{{transform:translateY(-3px) scale(1.025)}}
          #fox-tawk-launcher:active{{transform:scale(.97)}} #fox-tawk-launcher:focus-visible{{outline:3px solid #0664e8;outline-offset:3px}}
          #fox-tawk-launcher svg{{display:block;width:100%;height:100%;overflow:visible;pointer-events:none!important}} #fox-tawk-launcher svg *{{pointer-events:none!important}}
          @media(max-width:700px){{#fox-tawk-launcher{{right:4px!important;bottom:8px!important;width:210px;height:146px}}}}
          </style>
          <button id="fox-tawk-launcher" type="button" aria-label="{copy['open']}">
            <svg viewBox="0 0 250 174" role="img" aria-label="{copy['attention']} — {copy['open']}" xmlns="http://www.w3.org/2000/svg">
              <defs><path id="fox-launcher-arc" d="M 8 76 Q 125 2 242 76"/></defs>
              <text font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#ff922d" stroke="#0664e8" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round"><textPath href="#fox-launcher-arc" startOffset="50%" text-anchor="middle">{copy['attention']}</textPath></text>
              <text x="40" y="108" text-anchor="middle" font-size="28" transform="rotate(-10 40 108)">👋</text>
              <text x="40" y="143" text-anchor="middle" font-size="25" transform="rotate(-5 40 143)">✍</text>
              <image x="62" y="58" width="126" height="126" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
              <text x="125" y="68" text-anchor="middle" font-size="29">❤️</text>
              <text x="207" y="110" text-anchor="middle" font-size="28" transform="rotate(5 207 110)">🤝</text>
            </svg>
          </button>
          <script id="fox-tawk-launcher-controller">
          (function(){{
            var launcher=document.getElementById('fox-tawk-launcher');
            if(!launcher)return;
            var pending=false,waiting=false;
            var RESET_KEY='wdfox-tawk-clean-baseline-20260921';
            var needsReset=true;
            try{{needsReset=localStorage.getItem(RESET_KEY)!=='1';}}catch(e){{}}

            function showLauncher(){{
              launcher.style.setProperty('display','block','important');
              launcher.style.setProperty('visibility','visible','important');
              launcher.style.setProperty('opacity','1','important');
              launcher.style.setProperty('pointer-events','auto','important');
            }}
            function hideLauncher(){{
              launcher.style.setProperty('display','none','important');
              launcher.style.setProperty('visibility','hidden','important');
              launcher.style.setProperty('opacity','0','important');
              launcher.style.setProperty('pointer-events','none','important');
            }}
            function hideNative(){{
              var api=window.Tawk_API||{{}};
              try{{if(typeof api.hideWidget==='function')api.hideWidget();}}catch(e){{}}
            }}
            function openChat(){{
              var api=window.Tawk_API||{{}};
              if(typeof api.maximize!=='function')return false;
              try{{
                if(typeof api.showWidget==='function')api.showWidget();
                api.maximize();
                pending=false;
                waiting=false;
                hideLauncher();
                return true;
              }}catch(e){{return false;}}
            }}
            function waitForChat(){{
              if(waiting)return;
              waiting=true;
              var attempts=0;
              var timer=window.setInterval(function(){{
                attempts++;
                if(!pending||openChat()||attempts>=80){{
                  window.clearInterval(timer);
                  waiting=false;
                  if(pending&&attempts>=80)showLauncher();
                }}
              }},150);
            }}

            window.Tawk_API=window.Tawk_API||{{}};
            var previousOnLoad=window.Tawk_API.onLoad;
            var previousMaximized=window.Tawk_API.onChatMaximized;
            var previousMinimized=window.Tawk_API.onChatMinimized;
            var previousHidden=window.Tawk_API.onChatHidden;

            window.Tawk_API.onLoad=function(){{
              try{{if(typeof previousOnLoad==='function')previousOnLoad.apply(this,arguments);}}catch(e){{}}
              var api=window.Tawk_API||{{}};
              if(needsReset&&typeof api.endChat==='function'){{
                try{{api.endChat();}}catch(e){{}}
                needsReset=false;
                try{{localStorage.setItem(RESET_KEY,'1');}}catch(e){{}}
              }}
              hideNative();
              if(pending)window.setTimeout(function(){{if(!openChat())waitForChat();}},needsReset?450:120);
              else showLauncher();
            }};
            window.Tawk_API.onChatMaximized=function(){{
              try{{if(typeof previousMaximized==='function')previousMaximized.apply(this,arguments);}}catch(e){{}}
              hideLauncher();
            }};
            window.Tawk_API.onChatMinimized=function(){{
              try{{if(typeof previousMinimized==='function')previousMinimized.apply(this,arguments);}}catch(e){{}}
              pending=false;hideNative();showLauncher();
            }};
            window.Tawk_API.onChatHidden=function(){{
              try{{if(typeof previousHidden==='function')previousHidden.apply(this,arguments);}}catch(e){{}}
              pending=false;hideNative();showLauncher();
            }};
            function activate(event){{
              if(event){{event.preventDefault();event.stopPropagation();}}
              pending=true;
              if(!openChat())waitForChat();
            }}
            launcher.addEventListener('click',activate);
            showLauncher();
          }})();
          </script>
          <script id="fox-tawk-language-loader" src="/tawk-language-loader.js?v=20260910c-reset1"></script>'''

          for path in Path('dist').rglob('*.html'):
              text = clean(path.read_text(encoding='utf-8'))
              m = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (m.group(1).lower().split('-')[0].split('_')[0] if m else 'sk')
              if lang in WIDGETS and '</body>' in text:
                  text = text.replace('</body>', snippet(lang) + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Tawk loader without visible fox overlay
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/1.0' "$url" || true)"
            if ! grep -q 'id="fox-tawk-button"' <<<"$html" && grep -q 'id="fox-tawk-launcher"' <<<"$html" && grep -q 'id="fox-tawk-language-loader"' <<<"$html" && grep -q '/tawk-language-loader.js' <<<"$html"; then
              echo 'LIVE_FOX_OVERLAY=REMOVED'
              echo 'LIVE_TAWK_WIDGET=1k1b9121q'
              exit 0
            fi
            sleep 8
          done
          echo 'LIVE_TAWK_WITHOUT_FOX_OVERLAY=FAIL'
          exit 1
