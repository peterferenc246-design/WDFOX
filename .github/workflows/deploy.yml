name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install Tawk widget with central language routing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>\s*\(function\(\)\{\s*var PROPERTY_ID=[\'\"]6a951d52c3c46c344587662a[\'\"];.*?\}\)\(\);\s*</script>', re.I|re.S),
          ]

          tawk = """<script type="text/javascript">
          (function(){
            var PROPERTY_ID='6a951d52c3c46c344587662a';
            /* Central Lang -> Tawk widget mapping. Add the remaining 8 widget IDs here as they are supplied. */
            var WIDGETS={sk:'1k1b9121q'};
            var lang=(document.documentElement.lang||'sk').toLowerCase().split(/[-_]/)[0];
            var widgetId=WIDGETS[lang]||WIDGETS.sk;

            window.Tawk_API=window.Tawk_API||{};
            window.Tawk_LoadStart=window.Tawk_LoadStart||new Date();

            window.WebDesignFOXSwitchChatLanguage=function(nextLang,navigate){
              try{localStorage.setItem('wdfox-language',(nextLang||'sk').toLowerCase().split(/[-_]/)[0]);}catch(e){}
              if(typeof navigate==='function')navigate();
            };

            var s1=document.createElement('script');
            var s0=document.getElementsByTagName('script')[0]||document.head.firstChild;
            s1.async=true;
            s1.src='https://embed.tawk.to/'+PROPERTY_ID+'/'+widgetId;
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
          })();
          </script>"""

          fallback = """<style id="fox-tawk-fallback-style">
          #fox-tawk-direct-chat{position:fixed!important;right:16px!important;bottom:16px!important;z-index:2147483647!important;display:block!important;border:0!important;border-radius:999px!important;padding:13px 18px!important;background:#f36a0a!important;color:#fff!important;font:700 14px/1.1 system-ui,sans-serif!important;box-shadow:0 8px 28px rgba(0,0,0,.28)!important;cursor:pointer!important}
          @media(max-width:560px){#fox-tawk-direct-chat{right:14px!important;bottom:14px!important;padding:12px 16px!important}}
          </style>
          <button id="fox-tawk-direct-chat" type="button" aria-label="Open live chat">💬 Live Chat</button>
          <script>
          (function(){
            var b=document.getElementById('fox-tawk-direct-chat');
            var direct='https://tawk.to/chat/6a951d52c3c46c344587662a/1k1b9121q?layout=modern';
            function hasWidget(){return !!document.querySelector('iframe[src*="tawk.to"],#tawkchat-container');}
            function hide(){if(b)b.style.display='none';}
            function open(){
              try{
                if(window.Tawk_API&&typeof window.Tawk_API.toggle==='function'){window.Tawk_API.toggle();return;}
                if(window.Tawk_API&&typeof window.Tawk_API.showWidget==='function'){window.Tawk_API.showWidget();return;}
              }catch(e){}
              window.location.href=direct;
            }
            if(b)b.addEventListener('click',open);
            var timer=setInterval(function(){if(hasWidget()){hide();clearInterval(timer);}},500);
          })();
          </script>"""

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)
              text = re.sub(r'\s*<script[^>]+embed\.tawk\.to/6a951d52c3c46c344587662a/[^>]*>.*?</script>', '', text, flags=re.I|re.S)
              text = re.sub(r'\s*<style[^>]+id=["\']fox-tawk-fallback-style["\'][^>]*>.*?</style>\s*<button[^>]+id=["\']fox-tawk-direct-chat["\'][^>]*>.*?</button>\s*<script>.*?</script>', '', text, flags=re.I|re.S)
              if '</body>' in text:
                  text = text.replace('</body>', tawk + '\n' + fallback + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
