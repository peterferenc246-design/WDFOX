name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Jobcenter AOK evidence PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          from pypdf import PdfReader, PdfWriter

          source = Path('privat/postfachnachricht-03.10.2026 09_30.pdf')
          image_path = Path('privat/Gutschein.jpg')
          output = Path('public/jobcenter/postfachnachricht-03.10.2026 09_30.pdf')

          if not source.is_file():
              raise SystemExit(f'Missing source PDF: {source}')
          if not image_path.is_file():
              raise SystemExit(f'Missing Gutschein image: {image_path}')

          output.parent.mkdir(parents=True, exist_ok=True)

          with Image.open(image_path) as img:
              img = ImageOps.exif_transpose(img).convert('RGB')
              image_pdf = BytesIO()
              img.save(image_pdf, format='PDF', resolution=150.0)
              image_pdf.seek(0)

              source_reader = PdfReader(str(source))
              image_reader = PdfReader(image_pdf)
              writer = PdfWriter()
              for page in source_reader.pages:
                  writer.add_page(page)
              for page in image_reader.pages:
                  writer.add_page(page)

              with output.open('wb') as fh:
                  writer.write(fh)

          merged = PdfReader(str(output))
          expected_pages = len(PdfReader(str(source)).pages) + 1
          if len(merged.pages) != expected_pages:
              raise SystemExit(f'Unexpected page count: {len(merged.pages)} != {expected_pages}')
          if output.stat().st_size <= source.stat().st_size:
              raise SystemExit('Generated PDF is unexpectedly not larger than the source PDF')

          print(f'Generated {output} with {len(merged.pages)} pages')
          PY

      - name: Build Astro site
        run: pnpm run build

      - name: Validate production Tawk wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/tawk-language-loader.js
          test -s dist/tawk-native-force.js
          test -s dist/jobcenter-vodafone-evidence.js
          test -s dist/jobcenter-poster-fix.js
          grep -R -q 'id="fox-tawk-language-loader"' dist --include='*.html'
          grep -R -q 'id="fox-tawk-native-force"' dist --include='*.html'
          grep -R -q 'id="wdfox-jobcenter-vodafone-evidence"' dist --include='*.html'
          grep -R -q 'id="wdfox-jobcenter-poster-fix"' dist --include='*.html'
          grep -q 'Tawk_API.endChat' dist/tawk-language-loader.js
          if grep -F -q '#fixed-lang-layer a.language-flag[data-language]' dist/tawk-language-loader.js; then
            echo 'Blocked duplicate production language-click handler'
            exit 1
          fi
          if grep -q 'Tawk_API.switchWidget' dist/tawk-language-loader.js; then
            echo 'Blocked same-session Tawk widget switching in production build'
            exit 1
          fi
          if [[ -f dist/tawk-avatar-fix.js ]]; then
            grep -R -q 'id="fox-tawk-avatar-fix"' dist --include='*.html'
            grep -q 'wdfox-tawk-trigger-avatar-fix' dist/tawk-avatar-fix.js
          fi
          if grep -R -q 'id="fox-tawk-button"' dist --include='*.html'; then
            echo 'Legacy fox-tawk-button still present in production build'
            exit 1
          fi

          # Predproduction wrapper must stay Tawk-free. The embedded /jobcenter/ iframe
          # carries the single approved production Tawk package.
          preview_wrapper='dist/privat/jobcenter-predproduction/index.html'
          test -s "$preview_wrapper"
          grep -q 'id="jobcenter-preview"' "$preview_wrapper"
          if grep -E -q 'fox-tawk-language-loader|fox-tawk-native-force|fox-tawk-avatar-fix|embed\.tawk\.to|Tawk_API' "$preview_wrapper"; then
            echo 'Blocked duplicate Tawk package in Jobcenter predproduction wrapper'
            exit 1
          fi
          echo 'JOBCENTER_PREDPRODUCTION_WRAPPER_TAWK=NONE'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live approved Tawk package
        shell: bash
        run: |
          set -euo pipefail
          origin="https://www.foxprof.club"
          agent='WDFOX-Tawk-Verify/5.0'
          locales=(sk de en hr fr it pl es sv)
          loader_ref="/tawk-language-loader.js?v=${GITHUB_SHA}"
          launcher_ref="/tawk-native-force.js?v=${GITHUB_SHA}"
          avatar_ref="/tawk-avatar-fix.js?v=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5 6; do
            echo "Production validation attempt ${attempt}/6 for ${GITHUB_SHA}"
            pass=true
            for lang in "${locales[@]}"; do
              html="$(curl --location --fail --silent --show-error --max-time 30 --user-agent "$agent" "$origin/$lang/?tawk_verify=${GITHUB_SHA}" || true)"
              if [[ -z "$html" ]] \
                || ! grep -Fq "id=\"fox-tawk-language-loader\" src=\"$loader_ref\"" <<<"$html" \
                || ! grep -Fq "id=\"fox-tawk-native-force\" src=\"$launcher_ref\"" <<<"$html" \
                || grep -Fq 'id="fox-tawk-button"' <<<"$html"; then
                echo "FAIL: route /$lang/ missing approved SHA-matched Tawk package"
                pass=false
              fi
            done
            loader="$(curl --location --fail --silent --show-error --max-time 30 --user-agent "$agent" "$origin$loader_ref" || true)"
            launcher="$(curl --location --fail --silent --show-error --max-time 30 --user-agent "$agent" "$origin$launcher_ref" || true)"
            if [[ -z "$loader" || -z "$launcher" ]] \
              || ! grep -Fq 'Tawk_API.endChat' <<<"$loader" \
              || grep -Fq 'Tawk_API.switchWidget' <<<"$loader" \
              || grep -Fq '#fixed-lang-layer a.language-flag[data-language]' <<<"$loader" \
              || ! grep -Fq 'fox-tawk-concealed' <<<"$launcher"; then
              echo 'FAIL: loader or launcher unavailable or invalid'
              pass=false
            fi
            sk_html="$(curl --location --fail --silent --show-error --max-time 30 --user-agent "$agent" "$origin/sk/?tawk_verify=${GITHUB_SHA}" || true)"
            if grep -Fq 'id="fox-tawk-avatar-fix"' <<<"$sk_html"; then
              if ! grep -Fq "id=\"fox-tawk-avatar-fix\" src=\"$avatar_ref\"" <<<"$sk_html"; then
                echo 'FAIL: avatar version mismatch'
                pass=false
              else
                avatar="$(curl --location --fail --silent --show-error --max-time 30 --user-agent "$agent" "$origin$avatar_ref" || true)"
                if ! grep -Fq 'wdfox-tawk-trigger-avatar-fix' <<<"$avatar"; then
                  echo 'FAIL: missing avatar asset'
                  pass=false
                fi
              fi
            fi
            if [[ "$pass" == "true" ]]; then
              echo 'LIVE_APPROVED_TAWK_PACKAGE=OK'
              exit 0
            fi
            if (( attempt < 6 )); then sleep 8; fi
          done
          echo 'LIVE_APPROVED_TAWK_PACKAGE=FAIL'
          exit 1
