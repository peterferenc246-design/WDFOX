name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install native Tawk widget with central language routing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID='6a951d52c3c46c344587662a'
          WIDGETS={
              'sk':'1k1b9121q'
          }

          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>.*?embed\.tawk\.to/6a951d52c3c46c344587662a.*?</script>', re.I|re.S),
              re.compile(r'<style[^>]*id=["\']fox-tawk-fallback-style["\'][^>]*>.*?</style>\s*<button[^>]*id=["\']fox-tawk-direct-chat["\'][^>]*>.*?</button>\s*<script>.*?</script>', re.I|re.S),
          ]

          def native_snippet(widget_id):
              return f'''<script type="text/javascript">
          var Tawk_API=Tawk_API||{{}}, Tawk_LoadStart=new Date();
          (function(){{
          var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
          s1.async=true;
          s1.src='https://embed.tawk.to/{PROPERTY_ID}/{widget_id}';
          s1.charset='UTF-8';
          s1.setAttribute('crossorigin','*');
          s0.parentNode.insertBefore(s1,s0);
          }})();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)

              lang_match = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (lang_match.group(1).lower().split('-')[0].split('_')[0] if lang_match else 'sk')
              widget_id = WIDGETS.get(lang)

              if widget_id and '</body>' in text:
                  text = text.replace('</body>', native_snippet(widget_id) + '\n</body>', 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
