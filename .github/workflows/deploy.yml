name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install native Tawk widget with visible attention banner
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID='6a951d52c3c46c344587662a'
          WIDGETS={'sk':'1k1b9121q'}

          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>.*?embed\\.tawk\\.to/6a951d52c3c46c344587662a.*?</script>', re.I|re.S),
              re.compile(r'<style[^>]*id=["\']fox-tawk-attention-style["\'][^>]*>.*?</style>\\s*<div[^>]*id=["\']fox-tawk-attention["\'][^>]*>.*?</div>\\s*<script[^>]*>.*?</script>', re.I|re.S),
          ]

          def native_snippet(widget_id):
              return f'''<script type="text/javascript">
          var Tawk_API=Tawk_API||{{}}, Tawk_LoadStart=new Date();
          (function(){{
          var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
          s1.async=true;
          s1.src='https://embed.tawk.to/{PROPERTY_ID}/{widget_id}';
          s1.charset='UTF-8';
          s1.setAttribute('crossorigin','*');
          s0.parentNode.insertBefore(s1,s0);
          }})();
          </script>'''

          attention = '''<style id="fox-tawk-attention-style">
          #fox-tawk-attention{position:fixed;right:18px;bottom:18px;z-index:2147483646;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;filter:drop-shadow(0 6px 18px rgba(0,0,0,.22));}
          #fox-tawk-attention .fox-here{background:#fff;color:#008f95;border-radius:18px;padding:9px 14px 10px;font-size:18px;font-weight:800;line-height:1;white-space:nowrap;border:1px solid rgba(0,0,0,.08);}
          #fox-tawk-attention .fox-here span{font-size:20px;margin-right:5px;}
          #fox-tawk-attention .fox-chat{width:54px;height:54px;border-radius:50%;background:#18b887;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 4px 14px rgba(0,0,0,.2);}
          @media(max-width:700px){#fox-tawk-attention{right:14px;bottom:14px}.fox-here{font-size:15px!important;padding:8px 11px!important}.fox-chat{width:48px!important;height:48px!important;font-size:22px!important}}
          </style>
          <div id="fox-tawk-attention" role="button" tabindex="0" aria-label="Open live chat">
            <div class="fox-here"><span>👋</span>We Are Here!</div>
            <div class="fox-chat">💬</div>
          </div>
          <script>
          (function(){
            var b=document.getElementById('fox-tawk-attention');
            var direct='https://tawk.to/chat/6a951d52c3c46c344587662a/1k1b9121q?layout=modern';
            function open(){
              try{
                if(window.Tawk_API&&typeof window.Tawk_API.toggle==='function'){window.Tawk_API.toggle();return;}
                if(window.Tawk_API&&typeof window.Tawk_API.showWidget==='function'){window.Tawk_API.showWidget();return;}
              }catch(e){}
              window.location.href=direct;
            }
            if(b){b.addEventListener('click',open);b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});}
          })();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)

              lang_match = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (lang_match.group(1).lower().split('-')[0].split('_')[0] if lang_match else 'sk')
              widget_id = WIDGETS.get(lang)

              if widget_id and '</body>' in text:
                  text = text.replace('</body>', native_snippet(widget_id) + '\n' + attention + '\n</body>', 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
