name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Remove obsolete Tawk fallback from generated pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r'<script[^>]*>\s*\(function\(\)\{\s*'
              r'var PROPERTY_ID=[\'\"]6a951d52c3c46c344587662a[\'\"];\s*'
              r'var WIDGETS=\{.*?</script>',
              re.DOTALL,
          )

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              cleaned, count = pattern.subn('', text)
              if count:
                  path.write_text(cleaned, encoding='utf-8')
      - name: Add clean native Tawk bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          snippet = '<script src="/tawk-native-bootstrap.js?v=1"></script>'
          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '/tawk-native-bootstrap.js' not in text:
                  text = text.replace('</body>', snippet + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
