name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Remove legacy inline Tawk bootstrap
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # Remove only inline scripts containing the WDFOX Tawk property.
          # External language loader scripts and all unrelated site scripts remain untouched.
          pattern = re.compile(
              r'<script(?![^>]*src=)[^>]*>.*?6a951d52c3c46c344587662a.*?</script>',
              re.DOTALL | re.IGNORECASE,
          )

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              cleaned, count = pattern.subn('', text)
              if count:
                  path.write_text(cleaned, encoding='utf-8')
                  print(f'Removed {count} legacy Tawk inline block(s) from {path}')
      - name: Remove remaining Tawk force script
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # A legacy site component can emit this force-open block after </html>.
          # Remove only that Tawk-specific block; do not alter any other scripts.
          patterns = [
              re.compile(r'<script[^>]*>.*?forceTawkVisible.*?</script>', re.DOTALL | re.IGNORECASE),
              re.compile(r'<script[^>]*>.*?Tawk_API\.autoStart.*?</script>', re.DOTALL | re.IGNORECASE),
          ]

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              total = 0
              for pattern in patterns:
                  text, count = pattern.subn('', text)
                  total += count
              if total:
                  path.write_text(text, encoding='utf-8')
                  print(f'Removed {total} legacy Tawk force block(s) from {path}')
      - name: Install clean native Tawk bridge
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          snippet = '<script src="/tawk-native-force.js?v=' + os.environ['GITHUB_SHA'] + '"></script>'
          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '/tawk-native-force.js' not in text:
                  text = text.replace('</body>', snippet + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
