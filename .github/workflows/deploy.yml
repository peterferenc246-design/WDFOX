name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install desktop Attention Grabber and native Tawk chat
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {
              'sk': '1k1b9121q', 'de': '1k1bb2aln', 'en': '1k1bb9ast',
              'hr': '1k1bjvbjq', 'fr': '1k1blk6o4', 'it': '1k1bovo5t',
              'pl': '1k1bp5qda', 'es': '1k1bp6lk5', 'sv': '1k1bpdngj'
          }

          old_ui_re = re.compile(
              r'<style\b[^>]*id=["\']fox-tawk-button-style["\'][^>]*>.*?</style\s*>\s*'
              r'<div\b[^>]*id=["\']fox-tawk-button["\'][^>]*>.*?</div\s*>\s*'
              r'<script\b[^>]*id=["\']fox-tawk-lazy["\'][^>]*>.*?</script\s*>',
              re.I | re.S)
          tawk_src_re = re.compile(
              r'<script\b[^>]*src=["\'][^"\']*tawk[^"\']*["\'][^>]*>\s*</script\s*>',
              re.I | re.S)
          inline_script_re = re.compile(r'<script\b[^>]*>.*?</script\s*>', re.I | re.S)

          def clean(text):
              text = old_ui_re.sub('', text)
              text = tawk_src_re.sub('', text)
              def keep(match):
                  block = match.group(0)
                  if 'embed.tawk.to' in block or 'Tawk_API' in block or 'tawk-language-loader' in block:
                      return ''
                  return block
              return inline_script_re.sub(keep, text)

          def attention_svg():
              return '''<svg class="fox-attention-svg" viewBox="0 0 240 140" role="img" aria-label="I am here for you — open live chat" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <filter id="fox-attention-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".24"/></filter>
                  <path id="fox-attention-arc" d="M 0 52 Q 120 -2 240 52"/>
                </defs>
                <text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#f58220" stroke="#005eff" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round"><textPath href="#fox-attention-arc" startOffset="50%" text-anchor="middle">I am here for you!</textPath></text>
                <text x="20" y="82" font-size="28" transform="rotate(-18 20 82)">👋</text>
                <circle cx="104" cy="94" r="36" fill="#087cf0" filter="url(#fox-attention-shadow)"/>
                <g transform="translate(104 94) scale(.58) translate(-60 -60)">
                  <path d="M18 42L27 10l25 18 16-9 25 18 9 32c-2 28-22 47-51 47S20 87 18 42z" fill="#f58220" stroke="#171717" stroke-width="5" stroke-linejoin="round"/>
                  <path d="M31 25l4 29 17-16zM89 25l-4 29-17-16z" fill="#fff" stroke="#171717" stroke-width="5" stroke-linejoin="round"/>
                  <path d="M31 82c8-15 20-21 29-21s21 6 29 21c-7 13-17 20-29 20S38 95 31 82z" fill="#fff" stroke="#171717" stroke-width="5"/>
                  <ellipse cx="48" cy="61" rx="6" ry="8" fill="#171717"/><ellipse cx="72" cy="61" rx="6" ry="8" fill="#171717"/>
                  <path d="M54 76q6-6 12 0l-6 6z" fill="#171717"/>
                  <path d="M60 82q-6 9-15 5M60 82q6 9 15 5" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"/>
                </g>
              </svg>'''

          def snippet(widget):
              return f'''<style id="fox-tawk-button-style">
          #fox-tawk-button{{position:fixed!important;right:18px!important;bottom:18px!important;z-index:2147483646!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:none!important;margin:0!important;padding:0!important}}
          #fox-tawk-button .fox-tawk-attention{{position:relative!important;display:block!important;width:240px!important;height:140px!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation!important}}
          #fox-tawk-button .fox-attention-svg{{display:block!important;width:240px!important;height:140px!important;overflow:visible!important;transition:transform .18s ease!important}}
          #fox-tawk-button .fox-tawk-attention:hover .fox-attention-svg{{transform:scale(1.05) rotate(-1deg)!important}}
          #fox-tawk-button .fox-tawk-attention:active .fox-attention-svg{{transform:scale(.97)!important}}
          #fox-tawk-button .fox-tawk-open{{display:none!important}}
          @media(max-width:700px){{#fox-tawk-button{{right:0!important;bottom:0!important;width:240px!important;height:140px!important;pointer-events:auto!important;overflow:visible!important}}#fox-tawk-button .fox-tawk-attention{{display:block!important}}#fox-tawk-button .fox-tawk-open{{display:none!important}}}}
          </style>
          <div id="fox-tawk-button" aria-label="Open live chat">
            <button class="fox-tawk-attention" type="button" aria-label="Open live chat">{attention_svg()}</button>
            <button class="fox-tawk-open" type="button" aria-label="Open live chat"><span>💬</span>Live chat</button>
          </div>
          <script id="fox-tawk-lazy">
          (function(){{
            var PROPERTY_ID='{PROPERTY_ID}',WIDGET_ID='{widget}',loaded=false,loading=false;
            function openChat(){{var a=window.Tawk_API;if(a&&typeof a.showWidget==='function')try{{a.showWidget()}}catch(e){{}}if(a&&typeof a.maximize==='function')try{{a.maximize()}}catch(e){{}}}}
            function loadChat(){{if(loaded){{openChat();return}}if(loading)return;loading=true;window.Tawk_API=window.Tawk_API||{{}};window.Tawk_LoadStart=new Date();window.Tawk_API.customStyle={{zIndex:'2147483647 !important'}};window.Tawk_API.onLoad=function(){{loaded=true;loading=false;openChat()}};var s=document.createElement('script');s.async=true;s.src='https://embed.tawk.to/'+PROPERTY_ID+'/'+WIDGET_ID;s.charset='UTF-8';s.setAttribute('crossorigin','*');s.onload=function(){{loaded=true;loading=false;openChat()}};document.head.appendChild(s)}}
            function bind(){{var buttons=document.querySelectorAll('#fox-tawk-button .fox-tawk-attention,#fox-tawk-button .fox-tawk-open');buttons.forEach(function(b){{if(b.dataset.wdfxTawkBound==='1')return;b.dataset.wdfxTawkBound='1';b.addEventListener('click',function(e){{e.preventDefault();loadChat()}},false);b.addEventListener('touchend',function(e){{e.preventDefault();loadChat()}},{{passive:false}})}})}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind()
          }})();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = clean(path.read_text(encoding='utf-8'))
              m = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (m.group(1).lower().split('-')[0].split('_')[0] if m else 'sk')
              if lang in WIDGETS and '</body>' in text:
                  text = text.replace('</body>', snippet(WIDGETS[lang]) + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Attention Grabber and Tawk
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/1.0' "$url" || true)"
            if grep -q 'id="fox-tawk-button"' <<<"$html" && grep -q 'fox-tawk-attention' <<<"$html" && grep -q 'I am here for you!' <<<"$html" && grep -q '1k1b9121q' <<<"$html" && ! grep -q 'tawk.to/chat/' <<<"$html"; then
              echo 'LIVE_DESKTOP_ATTENTION_GRABBER=OK'
              echo 'LIVE_TAWK_WIDGET=1k1b9121q'
              exit 0
            fi
            sleep 8
          done
          echo 'LIVE_DESKTOP_ATTENTION_GRABBER=FAIL'
          exit 1
