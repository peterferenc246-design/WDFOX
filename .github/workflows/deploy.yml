name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install desktop Attention Grabber and native Tawk chat
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {
              'sk': '1k1b9121q', 'de': '1k1bb2aln', 'en': '1k1bb9ast',
              'hr': '1k1bjvbjq', 'fr': '1k1blk6o4', 'it': '1k1bovo5t',
              'pl': '1k1bp5qda', 'es': '1k1bp6lk5', 'sv': '1k1bpdngj'
          }

          old_ui_re = re.compile(
              r'<style\b[^>]*id=["\']fox-tawk-button-style["\'][^>]*>.*?</style\s*>\s*'
              r'<div\b[^>]*id=["\']fox-tawk-button["\'][^>]*>.*?</div\s*>\s*'
              r'<script\b[^>]*id=["\']fox-tawk-lazy["\'][^>]*>.*?</script\s*>',
              re.I | re.S)
          tawk_src_re = re.compile(
              r'<script\b[^>]*src=["\'][^"\']*tawk[^"\']*["\'][^>]*>\s*</script\s*>',
              re.I | re.S)
          inline_script_re = re.compile(r'<script\b[^>]*>.*?</script\s*>', re.I | re.S)

          def clean(text):
              text = old_ui_re.sub('', text)
              text = tawk_src_re.sub('', text)
              def keep(match):
                  block = match.group(0)
                  if 'embed.tawk.to' in block or 'Tawk_API' in block or 'tawk-language-loader' in block:
                      return ''
                  return block
              return inline_script_re.sub(keep, text)

          FOX_HEAD_PNG = ''

          def attention_svg():
              return f'''<svg class="fox-attention-svg" viewBox="0 0 240 140" role="img" aria-label="I am here for you — open live chat" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <path id="fox-attention-arc" d="M 0 52 Q 120 -2 240 52"/>
                </defs>
                <text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#f58220" stroke="#005eff" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round"><textPath href="#fox-attention-arc" startOffset="50%" text-anchor="middle">I am here for you!</textPath></text>
                <text x="20" y="82" font-size="28" transform="rotate(-18 20 82)">👋</text>
                <image x="110" y="48" width="99" height="84" preserveAspectRatio="none" href="data:image/png;base64,{FOX_HEAD_PNG}"/>
              </svg>'''

          def snippet(widget):
              return f'''<style id="fox-tawk-launcher-style">
          #fox-tawk-launcher{{position:fixed!important;right:18px;bottom:18px;z-index:2147483647!important;width:250px;height:174px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto!important;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));transition:transform .18s ease;touch-action:manipulation;isolation:isolate}}
          #fox-tawk-launcher:hover{{transform:translateY(-3px) scale(1.025)}}
          #fox-tawk-launcher:active{{transform:scale(.97)}} #fox-tawk-launcher:focus-visible{{outline:3px solid #0664e8;outline-offset:3px}}
          #fox-tawk-launcher svg{{display:block;width:100%;height:100%;overflow:visible;pointer-events:none!important}} #fox-tawk-launcher svg *{{pointer-events:none!important}}
          @media(max-width:700px){{#fox-tawk-launcher{{right:4px;bottom:8px;width:210px;height:146px}}}}
          </style>
          <button id="fox-tawk-launcher" type="button" aria-label="Open live chat">
            <svg viewBox="0 0 250 174" role="img" aria-label="I am here for you — open live chat" xmlns="http://www.w3.org/2000/svg">
              <defs><path id="fox-launcher-arc" d="M 8 76 Q 125 2 242 76"/></defs>
              <text font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#ff922d" stroke="#0664e8" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round"><textPath href="#fox-launcher-arc" startOffset="50%" text-anchor="middle">I am here for you!</textPath></text>
              <text x="40" y="108" text-anchor="middle" font-size="28" transform="rotate(-10 40 108)">👋</text>
              <text x="40" y="143" text-anchor="middle" font-size="25" transform="rotate(-5 40 143)">✍</text>
              <image x="62" y="58" width="126" height="126" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
              <text x="125" y="68" text-anchor="middle" font-size="29">❤️</text>
              <text x="207" y="110" text-anchor="middle" font-size="28" transform="rotate(5 207 110)">🤝</text>
            </svg>
          </button>
          <details id="fox-chat-settings" style="position:fixed;right:18px;bottom:195px;z-index:2147483647;background:white;color:#172333;border-radius:10px;padding:8px;box-shadow:0 3px 14px #0003;font:14px system-ui">
            <summary aria-label="Chat settings" style="cursor:pointer">⚙️</summary>
            <label style="display:block;padding:8px"><input type="checkbox" id="fox-chat-floating"> <span id="fox-chat-floating-label">Plávajúce okno</span></label>
            <span id="fox-chat-status" role="status"></span>
          </details>
          <script id="fox-tawk-direct-config">
          (function(){{
            var launcher=document.getElementById('fox-tawk-launcher');
            var pending=false;
            var ready=false;
            var floating=document.getElementById('fox-chat-floating');
            var status=document.getElementById('fox-chat-status');
            var lang=document.documentElement.lang.split('-')[0];
            var labels={{sk:'Plávajúce okno',de:'Schwebendes Fenster',en:'Floating window',hr:'Plutajući prozor',fr:'Fenêtre flottante',it:'Finestra mobile',pl:'Pływające okno',es:'Ventana flotante',sv:'Flytande fönster'}};
            document.getElementById('fox-chat-floating-label').textContent=labels[lang]||labels.en;
            try{{floating.checked=localStorage.getItem('wdfox-chat-floating-v3')==='true';}}catch(e){{}}
            floating.addEventListener('change',function(){{try{{localStorage.setItem('wdfox-chat-floating-v3',String(floating.checked));}}catch(e){{}}status.textContent='';}});
            function showLauncher(){{launcher.style.setProperty('display','block','important');launcher.style.setProperty('visibility','visible','important');launcher.style.setProperty('opacity','1','important');}}
            window.Tawk_API=window.Tawk_API||{{}};
            window.Tawk_API.customStyle=window.Tawk_API.customStyle||{{zIndex:'2000000000'}};
            var previousOnLoad=window.Tawk_API.onLoad;

            function openOfficialWidget(){{
              var api=window.Tawk_API||{{}};
              if(!ready||typeof api.maximize!=='function')return false;
              try{{
                if(typeof api.showWidget==='function')api.showWidget();
                api.maximize();
                pending=false;
                return true;
              }}catch(e){{return false;}}
            }}

            window.Tawk_API.onLoad=function(){{
              ready=true;
              try{{if(typeof previousOnLoad==='function')previousOnLoad();}}catch(e){{}}
              if(pending)window.setTimeout(openOfficialWidget,50);
            }};
            window.Tawk_API.onChatMaximized=showLauncher;
            window.Tawk_API.onChatMinimized=showLauncher;
            window.Tawk_API.onChatHidden=showLauncher;

            function requestOfficialWidget(e){{
              if(e){{e.preventDefault();e.stopPropagation();}}
              pending=true;
              showLauncher();
              if(!floating.checked){{
                if(openOfficialWidget()){{status.textContent='';return;}}
                status.textContent=lang==='sk'?'Chat sa načítava…':'Loading chat…';
                window.setTimeout(function(){{if(pending&&!ready){{status.textContent=lang==='sk'?'Chat sa nenačítal. Skúste plávajúce okno.':'Chat unavailable. Try the floating window.';document.getElementById('fox-chat-settings').open=true;}}}},10000);
                return;
              }}
              pending=false;
              if(ready&&typeof window.Tawk_API.popup==='function'){{window.Tawk_API.popup();return;}}
              var popupWidth=420,popupHeight=640;
              var left=Math.max(0,Math.round((window.screen.width-popupWidth)/2));
              var top=Math.max(0,Math.round((window.screen.height-popupHeight)/2));
              window.open(
                'https://tawk.to/chat/{PROPERTY_ID}/{widget}',
                'WDFOX_Tawk_Chat',
                'popup=yes,width='+popupWidth+',height='+popupHeight+',left='+left+',top='+top+',resizable=yes,scrollbars=yes'
              );
              pending=false;
            }}

            var lastActivation=0;
            function activateLauncher(e){
              var now=Date.now();
              if(now-lastActivation<700)return;
              lastActivation=now;
              requestOfficialWidget(e);
            }
            launcher.onclick=activateLauncher;
            launcher.onpointerup=activateLauncher;
            launcher.onpointerdown=function(e){ if(e.pointerType!=='mouse') activateLauncher(e); };
            document.addEventListener('click',function(e){
              var target=e.target && e.target.closest ? e.target.closest('#fox-tawk-launcher') : null;
              if(target===launcher) activateLauncher(e);
            },true);
            showLauncher();
          }})();
          </script>
          <script id="fox-tawk-language-loader" src="/tawk-language-loader.js"></script>'''

              return f'''<style id="fox-tawk-button-style">
          #fox-tawk-button{{display:none!important}}
          #fox-tawk-button .fox-tawk-attention{{position:relative!important;display:block!important;width:240px!important;height:140px!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation!important}}
          #fox-tawk-button .fox-attention-svg{{display:block!important;width:240px!important;height:140px!important;overflow:visible!important;transition:transform .18s ease!important}}
          #fox-tawk-button .fox-tawk-attention:hover .fox-attention-svg{{transform:scale(1.05) rotate(-1deg)!important}}
          #fox-tawk-button .fox-tawk-attention:active .fox-attention-svg{{transform:scale(.97)!important}}
          #fox-tawk-button .fox-tawk-open{{display:none!important}}
          @media(max-width:700px){{#fox-tawk-button{{right:0!important;bottom:0!important;width:240px!important;height:140px!important;pointer-events:auto!important;overflow:visible!important}}#fox-tawk-button .fox-tawk-attention{{display:block!important}}#fox-tawk-button .fox-tawk-open{{display:none!important}}}}
          </style>
          <div id="fox-tawk-button" aria-label="Open live chat">
            <button class="fox-tawk-attention" type="button" aria-label="Open live chat">{attention_svg()}</button>
            <button class="fox-tawk-open" type="button" aria-label="Open live chat"><span>💬</span>Live chat</button>
          </div>
          <script id="fox-tawk-lazy">
          (function(){{
            var PROPERTY_ID='{PROPERTY_ID}',WIDGET_ID='{widget}',loaded=false,loading=false;
            function openChat(){{var a=window.Tawk_API;if(a&&typeof a.showWidget==='function')try{{a.showWidget()}}catch(e){{}}if(a&&typeof a.maximize==='function')try{{a.maximize()}}catch(e){{}}}}
            function loadChat(){{if(loaded){{openChat();return}}if(document.querySelector('script[src*="embed.tawk.to/"]')){{loaded=true;return}}if(loading)return;loading=true;window.Tawk_API=window.Tawk_API||{{}};window.Tawk_LoadStart=new Date();var previousOnLoad=window.Tawk_API.onLoad;window.Tawk_API.onLoad=function(){{try{{if(typeof previousOnLoad==='function')previousOnLoad();}}catch(e){{}}loaded=true;loading=false;openChat()}};var s=document.createElement('script');s.async=true;s.src='https://embed.tawk.to/'+PROPERTY_ID+'/'+WIDGET_ID;s.charset='UTF-8';s.setAttribute('crossorigin','*');s.onload=function(){{loaded=true;loading=false;openChat()}};document.head.appendChild(s)}}
            function bind(){{var buttons=document.querySelectorAll('#fox-tawk-button .fox-tawk-attention,#fox-tawk-button .fox-tawk-open');buttons.forEach(function(b){{if(b.dataset.wdfxTawkBound==='1')return;b.dataset.wdfxTawkBound='1';b.addEventListener('click',function(e){{e.preventDefault();loadChat()}},false);b.addEventListener('touchend',function(e){{e.preventDefault();loadChat()}},{{passive:false}})}})}}
            function init(){{bind();loadChat()}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()
          }})();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = clean(path.read_text(encoding='utf-8'))
              m = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (m.group(1).lower().split('-')[0].split('_')[0] if m else 'sk')
              if lang in WIDGETS and '</body>' in text:
                  text = text.replace('</body>', snippet(WIDGETS[lang]) + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Tawk loader without visible fox overlay
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/1.0' "$url" || true)"
            if ! grep -q 'id="fox-tawk-button"' <<<"$html" && grep -q 'id="fox-tawk-launcher"' <<<"$html" && grep -q 'id="fox-tawk-language-loader"' <<<"$html" && grep -q '/tawk-language-loader.js' <<<"$html"; then
              echo 'LIVE_FOX_OVERLAY=REMOVED'
              echo 'LIVE_TAWK_WIDGET=1k1b9121q'
              exit 0
            fi
            sleep 8
          done
          echo 'LIVE_TAWK_WITHOUT_FOX_OVERLAY=FAIL'
          exit 1
