name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Install clean Tawk widget and clickable attention banner
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {'sk': '1k1b9121q'}

          # Remove every previous Tawk implementation from the generated HTML.
          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>.*?embed\.tawk\.to/6a951d52c3c46c344587662a.*?</script>', re.I | re.S),
              re.compile(r'<script[^>]*>\s*\(function\(\)\{\s*var PROPERTY_ID=["\']6a951d52c3c46c344587662a["\'];.*?</script>', re.I | re.S),
              re.compile(r'<style[^>]*id=["\']fox-tawk-attention-style["\'][^>]*>.*?</style>\s*<div[^>]*id=["\']fox-tawk-attention["\'][^>]*>.*?</div>\s*<script[^>]*>.*?</script>', re.I | re.S),
          ]

          def native_snippet(widget_id):
              return f'''<script type="text/javascript" id="fox-tawk-native">
          var Tawk_API=Tawk_API||{{}},Tawk_LoadStart=Tawk_LoadStart||new Date();
          (function(){{
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            s1.src='https://embed.tawk.to/{PROPERTY_ID}/{widget_id}';
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
          }})();
          </script>'''

          attention = '''<style id="fox-tawk-attention-style">
          #fox-tawk-attention{position:fixed!important;right:16px!important;bottom:18px!important;z-index:2147483646!important;display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;align-items:center!important;gap:10px!important;cursor:pointer!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;filter:drop-shadow(0 6px 18px rgba(0,0,0,.22))!important;}
          #fox-tawk-attention .fox-here{display:block!important;background:#fff!important;color:#111!important;border-radius:18px!important;padding:10px 15px!important;font-size:17px!important;font-weight:800!important;line-height:1!important;white-space:nowrap!important;border:1px solid rgba(0,0,0,.12)!important;}
          #fox-tawk-attention .fox-here span{font-size:20px!important;margin-right:5px!important;}
          #fox-tawk-attention .fox-chat{width:54px!important;height:54px!important;border-radius:50%!important;background:#18b887!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:25px!important;box-shadow:0 4px 14px rgba(0,0,0,.22)!important;}
          @media(max-width:700px){#fox-tawk-attention{right:12px!important;bottom:12px!important}#fox-tawk-attention .fox-here{font-size:15px!important;padding:9px 11px!important}#fox-tawk-attention .fox-chat{width:50px!important;height:50px!important;font-size:22px!important}}
          </style>
          <div id="fox-tawk-attention" role="button" tabindex="0" aria-label="Open live chat">
            <div class="fox-here"><span>👋</span>We Are Here!</div>
            <div class="fox-chat">💬</div>
          </div>
          <script id="fox-tawk-attention-script">
          (function(){
            function openTawk(){
              try{
                if(window.Tawk_API&&typeof window.Tawk_API.showWidget==='function')window.Tawk_API.showWidget();
                if(window.Tawk_API&&typeof window.Tawk_API.maximize==='function'){window.Tawk_API.maximize();return;}
                if(window.Tawk_API&&typeof window.Tawk_API.toggle==='function'){window.Tawk_API.toggle();return;}
              }catch(e){}
              window.open('https://tawk.to/chat/6a951d52c3c46c344587662a/1k1b9121q?layout=modern','_blank','noopener');
            }
            function bind(){
              var b=document.getElementById('fox-tawk-attention');
              if(!b)return;
              b.addEventListener('click',openTawk);
              b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openTawk();}});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
          })();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)

              lang_match = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (lang_match.group(1).lower().split('-')[0].split('_')[0] if lang_match else 'sk')
              widget_id = WIDGETS.get(lang)
              if widget_id and '</body>' in text:
                  text = text.replace('</body>', native_snippet(widget_id) + '\n' + attention + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
