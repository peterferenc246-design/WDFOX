name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Add Tawk attention click handler after build
        run: node scripts/tawk-attention-click-fix.mjs
      - name: Install clean Tawk widgets and Attention Grabber
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          PROPERTY_ID = '6a951d52c3c46c344587662a'
          WIDGETS = {
              'sk': '1k1b9121q',
              'de': '1k1bb2aln',
              'en': '1k1bb9ast',
              'hr': '1k1bjvbjq',
              'fr': '1k1blk6o4',
              'it': '1k1bovo5t',
              'pl': '1k1bp5qda',
              'es': '1k1bp6lk5',
              'sv': '1k1bpdngj',
          }

          remove_patterns = [
              re.compile(r'<script[^>]*src=["\']/tawk-language-loader\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*src=["\']/tawk-native-bootstrap\.js[^>]*></script>', re.I),
              re.compile(r'<script[^>]*>.*?embed\.tawk\.to/6a951d52c3c46c344587662a.*?</script>', re.I | re.S),
              re.compile(r'<script[^>]*>\s*\(function\(\)\{\s*var PROPERTY_ID=["\']6a951d52c3c46c344587662a["\'];.*?</script>', re.I | re.S),
              re.compile(r'<style[^>]*id=["\']fox-tawk-attention-style["\'][^>]*>.*?</style>\s*<[^>]*id=["\']fox-tawk-attention["\'][^>]*>.*?</[^>]+>\s*<script[^>]*>.*?</script>', re.I | re.S),
          ]

          def native_snippet(widget_id):
              return f'''<script type="text/javascript" id="fox-tawk-native">
          var Tawk_API=Tawk_API||{{}},Tawk_LoadStart=Tawk_LoadStart||new Date();
          Tawk_API.onLoad=function(){{
            try{{if(typeof Tawk_API.hideWidget==='function')Tawk_API.hideWidget();}}catch(e){{}}
          }};
          (function(){{
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            s1.src='https://embed.tawk.to/{PROPERTY_ID}/{widget_id}';
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
          }})();
          </script>'''

          def attention(widget_id):
              chat_url = f'https://tawk.to/chat/{PROPERTY_ID}/{widget_id}?layout=modern'
              return f'''<style id="fox-tawk-attention-style">
          #fox-tawk-attention{{position:fixed!important;right:18px!important;bottom:150px!important;left:auto!important;top:auto!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;cursor:pointer!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;transform:translateZ(0)!important;isolation:isolate!important;mix-blend-mode:normal!important;filter:drop-shadow(0 5px 14px rgba(0,0,0,.22))!important;margin:0!important;padding:0!important;}}
          #fox-tawk-attention .fox-here{{appearance:none!important;-webkit-appearance:none!important;position:relative!important;display:block!important;background:#fff!important;color:#202124!important;border:1px solid rgba(0,0,0,.12)!important;border-radius:12px!important;padding:11px 15px!important;font-size:15px!important;font-weight:700!important;line-height:1.15!important;white-space:nowrap!important;box-shadow:0 3px 14px rgba(0,0,0,.16)!important;cursor:pointer!important;pointer-events:auto!important;user-select:none!important;-webkit-tap-highlight-color:transparent!important;touch-action:manipulation!important;}}
          #fox-tawk-attention .fox-here:after{{content:""!important;position:absolute!important;right:19px!important;bottom:-7px!important;width:12px!important;height:12px!important;background:#fff!important;border-right:1px solid rgba(0,0,0,.12)!important;border-bottom:1px solid rgba(0,0,0,.12)!important;transform:rotate(45deg)!important;pointer-events:none!important;}}
          #fox-tawk-attention .fox-here span{{font-size:18px!important;margin-right:4px!important;pointer-events:none!important;}}
          @media(max-width:700px){{#fox-tawk-attention{{right:12px!important;bottom:120px!important}}#fox-tawk-attention .fox-here{{font-size:14px!important;padding:10px 13px!important;border-radius:11px!important}}}}
          </style>
          <div id="fox-tawk-attention" aria-label="Open live chat">
            <button type="button" class="fox-here" data-tawk-chat-url="{chat_url}" aria-label="Open live chat"><span>👋</span>We Are Here!</button>
          </div>
          <script id="fox-tawk-attention-script">
          (function(){{
            function maximize(){{
              try{{
                if(window.Tawk_API&&typeof window.Tawk_API.showWidget==='function')window.Tawk_API.showWidget();
                if(window.Tawk_API&&typeof window.Tawk_API.maximize==='function'){{window.Tawk_API.maximize();return true;}}
              }}catch(e){{}}
              return false;
            }}
            function openTawk(){{
              if(maximize())return;
              var tries=0;
              var timer=setInterval(function(){{
                tries++;
                if(maximize()||tries>=40)clearInterval(timer);
              }},250);
            }}
            window.__WDFOX_OPEN_TAWK=openTawk;
            function bind(){{
              var b=document.getElementById('fox-tawk-attention');
              var button=b&&b.querySelector('.fox-here');
              if(!button)return;
              button.onclick=function(e){{e.preventDefault();e.stopPropagation();openTawk();}};
              button.ontouchend=function(e){{e.preventDefault();e.stopPropagation();openTawk();}};
              b.onclick=function(e){{if(e.target===b){{e.preventDefault();openTawk();}}}};
            }}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
          }})();
          </script>'''

          for path in Path('dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in remove_patterns:
                  text = pattern.sub('', text)
              lang_match = re.search(r'<html[^>]*lang=["\']([^"\']+)["\']', text, re.I)
              lang = (lang_match.group(1).lower().split('-')[0].split('_')[0] if lang_match else 'sk')
              widget_id = WIDGETS.get(lang)
              if widget_id and '</body>' in text:
                  text = text.replace('</body>', native_snippet(widget_id) + '\n' + attention(widget_id) + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live www.foxprof.club serves the new Tawk Attention Grabber
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/sk/?tawk_verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            echo "Live verification attempt ${attempt}: ${url}"
            html="$(curl -L --fail --silent --show-error --max-time 30 -A 'WDFOX-Tawk-Verify/1.0' "$url" || true)"
            if grep -q 'fox-tawk-attention' <<<"$html" && grep -q '1k1b9121q' <<<"$html" && grep -q 'We Are Here!' <<<"$html" && grep -q 'data-tawk-chat-url' <<<"$html"; then
              echo 'LIVE_TAWK_ATTENTION_GRABBER=OK'
              echo 'LIVE_TAWK_WIDGET=1k1b9121q'
              exit 0
            fi
            echo 'Expected Tawk Attention Grabber markers not yet visible from the custom domain.'
            sleep 8
          done
          echo 'LIVE_TAWK_ATTENTION_GRABBER=FAIL'
          exit 1
