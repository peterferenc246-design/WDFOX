name: Verify Jobcenter Freund email live
on:
  push:
    branches: [main]
    paths:
      - 'public/jobcenter-source.html'
      - '.github/workflows/verify-jobcenter-freund-live.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Daniel Freund section and downloads on live Jobcenter page
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.foxprof.club/jobcenter/?freund_verify=${GITHUB_SHA}"
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --max-time 30 -A 'WDFOX-Jobcenter-Verify/3.0' -o "$tmp" -w '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$code"
          echo "BYTES=$(wc -c < "$tmp")"
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          marker = 'daniel-freund-email-2026-10-05'
          i = text.find(marker)
          print('MARKER_INDEX=', i)
          if i >= 0:
              print('SECTION_CHUNK_BEGIN')
              print(text[max(0, i-300):i+7000])
              print('SECTION_CHUNK_END')
          PY
          for marker in \
            'daniel-freund-email-2026-10-05' \
            'DRINGEND – Existenzsicherung Krankenversicherung.pdf' \
            'Text tela emailu_SK.pdf' \
            'postfachnachricht-05.10.2026 10_16.pdf'; do
            if grep -F -q "$marker" "$tmp"; then
              echo "FOUND: $marker"
            else
              echo "MISSING: $marker"
            fi
          done
          if [[ "$code" == "200" ]] \
            && grep -F -q 'daniel-freund-email-2026-10-05' "$tmp" \
            && grep -F -q 'DRINGEND – Existenzsicherung Krankenversicherung.pdf' "$tmp" \
            && grep -F -q 'Text tela emailu_SK.pdf' "$tmp" \
            && grep -F -q 'postfachnachricht-05.10.2026 10_16.pdf' "$tmp"; then
            echo 'LIVE_JOBCENTER_FREUND_EMAIL=OK'
            exit 0
          fi
          echo 'LIVE_JOBCENTER_FREUND_EMAIL=FAIL'
          exit 1
