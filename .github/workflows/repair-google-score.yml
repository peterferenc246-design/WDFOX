name: Repair Google score
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair score and labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/FoxAnalyzerLauncher.astro')
          s=p.read_text()
          start=s.find(' const setCategoryScore=')
          end=s.find(' const filterResults=',start)
          if start < 0 or end < 0:
              raise SystemExit('score markers not found')
          fn=''' const setCategoryScore=(r,key)=>{const score=r.querySelector(".score");if(!score)return;const sections=[...r.querySelectorAll(".section")];let cards=[];if(key==="google"){const top=r.querySelector(".top");const crawl=top?[...top.querySelectorAll(".card")].filter(x=>/crawlability|google index|robots|sitemap/i.test(x.textContent||"")):[];const gs=sections.filter(s=>/google|lighthouse/i.test(s.querySelector("h2")?.textContent||"")).flatMap(s=>[...s.querySelectorAll(".card")]);cards=[...crawl,...gs]}else if(key==="pixel"){const sec=sections.find(x=>/meta pixel/i.test(x.querySelector("h2")?.textContent||""));cards=sec?[...sec.querySelectorAll(".card")]:[]}else if(key==="meta"||key==="twitter"){const sec=sections.find(x=>/techn/i.test(x.querySelector("h2")?.textContent||""));const re=key==="meta"?/open graph/i:/twitter cards/i;cards=sec?[...sec.querySelectorAll(".card")].filter(x=>re.test(x.textContent||"")):[]}else if(key==="security"){const top=r.querySelector(".top");cards=top?[...top.querySelectorAll(".card")].filter(x=>/https/i.test(x.textContent||"")):[]}else{cards=sections.flatMap(sec=>[...sec.querySelectorAll(".card")].filter(x=>classify(x.textContent,key)))}const checks=cards.filter(x=>x.querySelector("strong.ok")||x.querySelector("strong.bad"));if(!checks.length){score.innerHTML=`<div class="fox-category-scores"><div class="fox-category-score"><small>${categoryName(key)} SCORE 3.0</small><strong>—</strong><p>Žiadne vyhodnotiteľné kontroly</p></div></div>`;return}const passed=checks.filter(x=>x.querySelector("strong.ok")).length;score.innerHTML=`<div class="fox-category-scores"><div class="fox-category-score"><small>${categoryName(key)} SCORE 3.0</small><strong>${Math.round(passed/checks.length*100)}/100</strong><p>${passed}/${checks.length} vyhodnotených kontrol</p></div></div>`};
'''
          p.write_text(s[:start]+fn+s[end:])
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          s=s.replace("crawl:'Google-Crawlability'","crawl:'FOX Crawlability'")
          s=s.replace("crawl:'Google crawlability'","crawl:'FOX Crawlability'")
          s=s.replace("crawl:'Google-Crawlability'","crawl:'FOX Crawlability'")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FoxAnalyzerLauncher.astro src/pages/analyzer.astro
          git commit -m 'fix: separate FOX crawlability and correct Google score' || true
          git push || true
          rm -f .github/workflows/repair-google-score.yml
          git add .github/workflows/repair-google-score.yml
          git commit -m 'chore: remove temporary Google score repair workflow' || true
          git push || true
