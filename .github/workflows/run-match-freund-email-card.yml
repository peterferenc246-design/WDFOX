name: Match Freund email card layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-match-freund-email-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match Daniel Freund email card layout
        run: python3 .github/scripts/match_freund_email_previous_card.py
      - name: Commit change
        run: |
          if git diff --quiet -- public/jobcenter-source.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-source.html
          git commit -m 'Match Daniel Freund email layout to previous card style'
          git push origin HEAD:main
