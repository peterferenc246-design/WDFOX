name: Fix Meta Pixel position
on:
  push:
    paths:
      - '.github/workflows/fix-pixel-position.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move installer after analyzer and disable self-moving script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/FoxAnalyzerLauncher.astro')
          s=p.read_text()
          old=' <div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>\n <div class="fox-analyzer-panel" hidden>'
          new=' <div class="fox-analyzer-panel" hidden>'
          if old not in s:
              raise SystemExit('expected pixel slot/analyzer sequence not found')
          s=s.replace(old,new,1)
          marker='</div>\n</div>\n<style>'
          insert='</div>\n <div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>\n</div>\n<style>'
          if marker not in s:
              raise SystemExit('launcher closing marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s)

          p=Path('src/components/MetaPixelInstaller.astro')
          s=p.read_text()
          old='\n<script>\nconst pixelInstaller = document.getElementById("meta-pixel-installer");\nconst foxLauncher = document.getElementById("fox-analyzer-launcher");\nif (pixelInstaller && foxLauncher) foxLauncher.insertAdjacentElement("afterend", pixelInstaller);\n</script>\n'
          if old not in s:
              raise SystemExit('installer self-moving script not found')
          s=s.replace(old,'\n',1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FoxAnalyzerLauncher.astro src/components/MetaPixelInstaller.astro
          git commit -m "fix: keep Meta Pixel installer after analyzer" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/fix-pixel-position.yml
          git add .github/workflows/fix-pixel-position.yml
          git commit -m "chore: remove temporary pixel position workflow" || exit 0
          git push
