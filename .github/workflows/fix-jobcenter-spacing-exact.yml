name: Fix Jobcenter exact spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-spacing-exact.yml'

permissions:
  contents: write

jobs:
  fix-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact spacing requested
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')
          reps = [
            ('<p style="margin:0 0 3px">Sehr geehrte Damen und Herren,</p>', '<p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>'),
            ('<p style="margin:0 0 3px">anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>', '<p style="margin:0">anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>'),
            ('<p style="margin:0 0 3px">Mit freundlichen Grüßen<br>Peter Ferenc</p>', '<p style="margin:0">Mit freundlichen Grüßen<br>Peter Ferenc</p>'),
            ('data-wdfox-reference-links="1" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0 0 4px;line-height:1.2"', 'data-wdfox-reference-links="1" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0;line-height:1.2"'),
            ('<div style="font-family:monospace;color:#666;overflow:hidden;white-space:nowrap;margin:4px 0 4px">======================================================</div>', '<div style="font-family:monospace;color:#666;overflow:hidden;white-space:nowrap;margin:0">======================================================</div>'),
            ('<div style="font-weight:700;margin:0 0 4px">pdf Beilage:</div>', '<div style="font-weight:700;margin:0">pdf Beilage:</div>'),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('Target not found: ' + old[:80])
              s = s.replace(old,new,1)
          # only the first body salutation after the pdf label gets the requested blank line
          label = s.find('pdf Beilage:')
          marker = '<p style="margin:0 0 4px">Sehr geehrte Damen und Herren,</p>'
          pos = s.find(marker, label)
          if pos < 0:
              raise SystemExit('PDF salutation marker not found')
          s = s[:pos] + s[pos:].replace(marker, '<p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit spacing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Match Jobcenter message spacing exactly to requested layout'
          git push
