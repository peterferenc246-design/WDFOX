name: Dispatch requested deploy once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy for current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo peterferenc246-design/WDFOX --ref main

      - name: Remove temporary workflow
        uses: actions/checkout@v4

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-deploy-once.yml
          git commit -m "Remove temporary deploy dispatcher"
          git push
