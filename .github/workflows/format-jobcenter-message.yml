name: Format Jobcenter message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-jobcenter-message.yml'

permissions:
  contents: write

jobs:
  format-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested message format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/jobcenter-poster-fix.js')
          s=p.read_text(encoding='utf-8')
          old='''              <div style="margin:0;padding:0">\n                <div style="font-weight:700;margin:0 0 6px">postfachnachricht-04.10.2026 15_21</div>\n                <p style="margin:0 0 4px">Sehr geehrte Damen und Herren, anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>\n                <p style="margin:0 0 4px">Mit freundlichen Grüßen</p>\n                <p style="margin:0 0 6px">Peter Ferenc</p>\n                <div style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin:0 0 8px;line-height:1.25">\n                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a>\n                  <a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>\n                </div>\n                <hr style="border:0;border-top:1px solid #8f8f8f;margin:6px 0 8px">\n              </div>\n              <p style="margin:0 0 4px">Sehr geehrte Damen und Herren,</p>\n              <p style="margin:0 0 4px">meine Situation ist inzwischen keine Frage weiteren Wartens, weiterer Erklärungen oder der fortlaufenden Ausgabe einzelner Gutscheine mehr. Ich benötige <strong>eine tatsächliche finanzielle Absicherung meiner grundlegenden Lebensbedürfnisse</strong> und zugleich die Mittel, die es mir ermöglichen, so schnell wie möglich durch die geplante selbständige Tätigkeit ein eigenes Einkommen aufzubauen.</p>'''
          new='''              <div style="margin:0;padding:0">\n                <div style="font-weight:700;margin:0 0 12px">postfachnachricht-04.10.2026 15_21</div>\n                <p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>\n                <p style="margin:0 0 10px">anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>\n                <p style="margin:0 0 10px">Mit freundlichen Grüßen</p>\n                <p style="margin:0 0 4px">Peter Ferenc</p>\n                <div style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin:0 0 6px;line-height:1.25">\n                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a>\n                  <a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>\n                </div>\n                <div style="font-family:monospace;color:#666;overflow:hidden;white-space:nowrap;margin:4px 0 10px">======================================================</div>\n              </div>\n              <p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>\n              <p style="margin:0 0 4px">meine Situation ist inzwischen keine Frage weiteren Wartens, weiterer Erklärungen oder der fortlaufenden Ausgabe einzelner Gutscheine mehr. Ich benötige <strong>eine tatsächliche finanzielle Absicherung meiner grundlegenden Lebensbedürfnisse</strong> und zugleich die Mittel, die es mir ermöglichen, so schnell wie möglich durch die geplante selbständige Tätigkeit ein eigenes Einkommen aufzubauen.</p>'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit formatted message
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Format 04.10 Jobcenter message exactly as requested'
          git push
