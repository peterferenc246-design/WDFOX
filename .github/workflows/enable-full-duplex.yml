name: Enable FOX full-duplex voice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enable FOX full-duplex voice') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch communicator for simultaneous two-way speech
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/FoxLiveTranslator.astro')
          s = p.read_text(encoding='utf-8')
          marker = '/* FOX_FULL_DUPLEX_V1 */'
          if marker in s:
              print('Full-duplex patch already present')
              raise SystemExit(0)
          needle = '\n}</script>'
          if needle not in s:
              raise SystemExit('Could not locate end of FOX translator script')
          inject = r'''\n/* FOX_FULL_DUPLEX_V1 */
let foxDuplexStarted=false;
const startFoxFullDuplex=()=>{
  if(foxDuplexStarted) return;
  if(!root.classList.contains('is-call-mode')) return;
  const state=String(commStatus?.textContent||'').toLowerCase();
  const activeWord=String(t.active||'').toLowerCase();
  if(activeWord && !state.includes(activeWord)) return;
  if(mic?.disabled) return;
  foxDuplexStarted=true;
  try{ mic.click(); }catch{}
};
const foxDuplexObserver=new MutationObserver(()=>startFoxFullDuplex());
if(commStatus) foxDuplexObserver.observe(commStatus,{childList:true,subtree:true,characterData:true});
const foxDuplexTimer=setInterval(startFoxFullDuplex,1000);
window.addEventListener('beforeunload',()=>clearInterval(foxDuplexTimer));
'''
          s = s.replace(needle, inject + needle, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FoxLiveTranslator.astro
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enable FOX full-duplex voice"
          git push
