name: Fix analyzer head parser
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch analyzer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          old="""let __foxDocCacheHtml='';let __foxDocCache=null;function doc(html){try{const h=String(html||'');if(__foxDocCache&&h===__foxDocCacheHtml)return __foxDocCache;const parsed=new DOMParser().parseFromString(h,'text/html');__foxDocCacheHtml=h;__foxDocCache=parsed;return parsed}catch{return null}}"""
          new="""let __foxDocCacheHtml='';let __foxDocCache=null;function doc(html){try{const h=String(html||'');const m=h.match(/<head\\b[^>]*>[\\s\\S]*?<\\/head>/i);const source=m?m[0]:h.slice(0,200000);if(__foxDocCache&&source===__foxDocCacheHtml)return __foxDocCache;const parsed=new DOMParser().parseFromString(source,'text/html');__foxDocCacheHtml=source;__foxDocCache=parsed;return parsed}catch{return null}}"""
          if old not in s:
              raise SystemExit('old doc function not found')
          s=s.replace(old,new,1)
          old2="""const analyzerResultObserver=new MutationObserver(()=>applyAnalyzerTriState());analyzerResultObserver.observe(document.documentElement,{subtree:true,childList:true});document.documentElement.lang=L;document.body.classList.toggle('embed',qs.get('embed')==='1');"""
          new2="""document.documentElement.lang=L;document.body.classList.toggle('embed',qs.get('embed')==='1');"""
          if old2 not in s:
              raise SystemExit('observer block not found')
          s=s.replace(old2,new2,1)
          old3="""$('result').innerHTML=out;$('result').hidden=false}catch(err)"""
          new3="""$('result').innerHTML=out;$('result').hidden=false;applyAnalyzerTriState();}catch(err)"""
          if old3 not in s:
              raise SystemExit('result render point not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git diff --cached --quiet && echo 'No changes' || git commit -m 'fix: parse analyzer head only and remove observer loop'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-analyzer-head-parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-analyzer-head-parser.yml
          git diff --cached --quiet && exit 0 || git commit -m 'chore: remove temporary analyzer patch workflow'
          git push
