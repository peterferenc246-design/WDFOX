name: WDFOX SK Preview Diagnostic

on:
  push:
    branches: [qa-requests]
    paths:
      - '.github/workflows/wdfox-browser-sk-diagnostic.yml'

permissions:
  contents: read

jobs:
  sk-preview-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-requests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/wdfox-diag && cd /tmp/wdfox-diag
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Diagnose SK PREVIEW bootstrap
        env:
          REQUEST_FILE: ${{ github.workspace }}/ops/qa/requests/pre-swap-functional-vercel-preview-20261001-v12.json
        run: |
          cd /tmp/wdfox-diag
          cat > diag.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const req=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'sk-SK'});
          const page=await context.newPage();
          const failed=[]; const consoleErrors=[]; const responses=[];
          page.on('requestfailed',r=>{ if(/tawk\.to|tawk\.link/i.test(r.url())) failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`); });
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('response',r=>{ if(/tawk\.to|tawk\.link/i.test(r.url())) responses.push(`${r.status()} ${r.url()}`); });
          await page.goto(req.target_url,{waitUntil:'domcontentloaded',timeout:45000});
          const body=(await page.locator('body').innerText().catch(()=>''));
          console.log('FINAL_URL_AFTER_SHARE='+page.url());
          console.log('VERCEL_AUTH_PAGE='+/Protected by Vercel Authentication|Log in to Vercel|Vercel Authentication/i.test(body));
          const u=new URL(page.url()); u.pathname='/sk/'; u.search='';
          await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(30000);
          const ev=await page.evaluate(()=>({
            url:location.href,
            lang:document.documentElement.getAttribute('data-wdfox-tawk-language'),
            widget:document.documentElement.getAttribute('data-wdfox-tawk-widget'),
            property:window.WebDesignFOXTawkPropertyId||null,
            globalWidget:window.WebDesignFOXTawkWidgetId||null,
            apiReady:!!(window.Tawk_API&&(typeof window.Tawk_API.maximize==='function'||typeof window.Tawk_API.toggle==='function')),
            launcher:!!document.getElementById('fox-tawk-preview-launcher'),
            scripts:[...document.querySelectorAll('script[src]')].map(x=>x.src).filter(x=>/tawk/i.test(x)),
            iframes:[...document.querySelectorAll('iframe[src]')].map(x=>x.src).filter(x=>/tawk/i.test(x)),
            previewScript:!!document.querySelector('script[src*="tawk-preview-external.js"]'),
            prodScript:!!document.querySelector('script[src*="tawk-language-loader.js"]')
          }));
          console.log('EVIDENCE='+JSON.stringify(ev));
          console.log('TAWK_RESPONSES='+JSON.stringify(responses));
          console.log('TAWK_FAILED='+JSON.stringify(failed));
          console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
          await browser.close();
          if(ev.widget!=='1k3jmfkjq'||ev.property!=='6aba373f25498e3445ceb5b6'||!ev.previewScript||ev.prodScript) process.exit(2);
          if(!ev.apiReady) process.exit(3);
          EOF
          node diag.mjs
