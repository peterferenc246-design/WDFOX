name: Fix analyzer runtime parser
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore DOM parser helpers
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text(encoding='utf-8')
          marker='function foxCanonical(html,target){'
          helpers="""function doc(html){try{return new DOMParser().parseFromString(String(html||''),'text/html')}catch{return null}}\nfunction meta(html,name){const d=doc(html);if(!d)return '';const n=String(name).toLowerCase();const el=[...d.querySelectorAll('meta')].find(x=>String(x.getAttribute('name')||x.getAttribute('property')||'').toLowerCase()===n);return el?.getAttribute('content')||''}\n"""
          if 'function doc(html)' not in s:
            s=s.replace(marker,helpers+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate build
        run: |
          npm install --global pnpm@10.4.1
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git diff --cached --quiet || git commit -m 'fix: restore analyzer DOM helpers [runtime-fix]'
          git push
