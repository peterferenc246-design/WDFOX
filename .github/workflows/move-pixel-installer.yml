name: Move Meta Pixel installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move installer into analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/FoxAnalyzerLauncher.astro')
          s=p.read_text()
          if 'import MetaPixelInstaller from "./MetaPixelInstaller.astro";' not in s:
              s=s.replace('---\nconst locale', '---\nimport MetaPixelInstaller from "./MetaPixelInstaller.astro";\nconst locale', 1)
          marker=' <div class="fox-analyzer-panel" hidden>'
          if '<div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>' not in s:
              s=s.replace(marker, ' <div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>\n'+marker, 1)
          css='.fox-pixel-slot{padding:0 clamp(20px,5vw,72px) 18px;background:#0f1012}.fox-pixel-slot :global(.pixel-installer){width:100%;margin:0;box-sizing:border-box}.fox-pixel-slot :global(.pixel-installer-copy){min-width:0}.fox-pixel-slot :global(.pixel-installer h2){font-size:clamp(18px,2vw,27px)}'
          if '.fox-pixel-slot{' not in s:
              s=s.replace('</style>', css+'\n</style>', 1)
          p.write_text(s)

          p=Path('src/pages/[lang]/index.astro')
          s=p.read_text()
          s=s.replace('import MetaPixelInstaller from "../../components/MetaPixelInstaller.astro";\n','',1)
          s=s.replace('  <MetaPixelInstaller locale={lang} />\n','',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FoxAnalyzerLauncher.astro 'src/pages/[lang]/index.astro'
          git commit -m "fix: place Meta Pixel installer inside analyzer" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only
          rm -f .github/workflows/move-pixel-installer.yml
          git add .github/workflows/move-pixel-installer.yml
          git commit -m "chore: remove temporary pixel installer workflow" || exit 0
          git push
