name: Fix analyzer technical checks
on:
  push:
    paths:
      - '.github/workflows/fix-analyzer-technical-checks.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical and viewport checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/analyzer.astro')
          s = p.read_text()

          old_jina = "return{content:await r.text(),url:local.href}"
          new_jina = "return{content:await r.text(),url:r.url||local.href}"
          if old_jina not in s:
              raise SystemExit('local jina return marker not found')
          s = s.replace(old_jina, new_jina, 1)

          marker = "function foxSchema(html){"
          viewport_fn = """function foxViewport(html){
            try{
              const value=meta(html,'viewport').trim().toLowerCase();
              if(!value)return false;
              const parts=value.split(',').map(x=>x.trim()).filter(Boolean);
              const width=parts.some(x=>x==='width=device-width');
              const scale=parts.some(x=>/^initial-scale=1(?:\\.0+)?$/.test(x));
              return width&&scale;
            }catch{return false}
          }

          """
          if "function foxViewport(html)" not in s:
              if marker not in s:
                  raise SystemExit('schema marker not found')
              s = s.replace(marker, viewport_fn + marker, 1)

          s = s.replace("canon=foxCanonical(html,target),schema=foxSchema(html),viewport=pass('viewport')", "canon=foxCanonical(html,head0.url||target),schema=foxSchema(html),viewport=foxViewport(html)", 1)

          replacements = {
              "crawl:'Google-Crawlability'": "crawl:'FOX Crawlability'",
              "crawl:'Google crawlability'": "crawl:'FOX Crawlability'",
              "crawl:'Exploration Google'": "crawl:'FOX Crawlability'",
              "crawl:'Indeksiranje Google'": "crawl:'FOX Crawlability'",
              "crawl:'Crawlability Google'": "crawl:'FOX Crawlability'",
              "crawl:'Rastreo de Google'": "crawl:'FOX Crawlability'",
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          if "viewport=foxViewport(html)" not in s:
              raise SystemExit('viewport patch did not apply')
          if "canon=foxCanonical(html,head0.url||target)" not in s:
              raise SystemExit('canonical patch did not apply')

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro .github/workflows/fix-analyzer-technical-checks.yml
          git commit -m 'fix: make analyzer canonical and viewport checks independent'
          git push
