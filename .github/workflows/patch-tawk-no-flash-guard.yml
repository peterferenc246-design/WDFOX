name: One-time Tawk no-flash guard patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_tawk_no_flash_guard.py'
      - '.github/workflows/patch-tawk-no-flash-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch_tawk_no_flash_guard.py
      - name: Commit loader fix
        run: |
          git config user.name "WDFOX Tawk Bot"
          git config user.email "actions@github.com"
          git add public/tawk-language-loader.js
          git commit -m "Prevent Tawk window flash on refresh"
          git push origin main
