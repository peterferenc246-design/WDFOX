name: Force Meta Pixel installer placement
on:
  push:
    paths:
      - '.github/workflows/force-pixel-placement.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place installer after analyzer panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/MetaPixelInstaller.astro')
          s=p.read_text()
          start=s.find('<script>\nconst pixelInstaller')
          if start >= 0:
              end=s.find('</script>', start)
              if end >= 0:
                  s=s[:start]+s[end+len('</script>'):] 
          p.write_text(s)

          p=Path('src/components/FoxAnalyzerLauncher.astro')
          s=p.read_text()
          import_line='import MetaPixelInstaller from "./MetaPixelInstaller.astro";'
          if import_line not in s:
              s=s.replace('---\n','---\n'+import_line+'\n',1)
          old=' <div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>\n <div class="fox-analyzer-panel" hidden>'
          if old in s:
              s=s.replace(old,' <div class="fox-analyzer-panel" hidden>',1)
          if '<div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>' not in s:
              marker=' </div>\n</div>\n<style>'
              pos=s.find(marker)
              if pos<0:
                  raise SystemExit('launcher structure marker not found')
              s=s[:pos]+' <div class="fox-pixel-slot"><MetaPixelInstaller locale={locale} /></div>\n'+s[pos:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MetaPixelInstaller.astro src/components/FoxAnalyzerLauncher.astro
          git commit -m 'fix: keep Meta Pixel installer after analyzer' || true
          git push
          rm -f .github/workflows/force-pixel-placement.yml
          git add .github/workflows/force-pixel-placement.yml
          git commit -m 'chore: remove temporary pixel placement workflow' || true
          git push
