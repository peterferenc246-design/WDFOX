# Temporary repair workflow; removed after deployment verification.
name: Repair contact map and social icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore contact layout and real social icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/Landing.astro')
          t = p.read_text(encoding='utf-8')
          if '<svg viewBox="0 0 24 24"' not in t:
              raise SystemExit('repair already missing; stop')
          css = Path('src/styles/site.css')
          s = css.read_text(encoding='utf-8')
          if 'WDFOX contact map/social restoration v2' not in s:
              raise SystemExit('contact restoration CSS missing; stop')
          print('Contact repair already applied; preserving files.')
          PY
