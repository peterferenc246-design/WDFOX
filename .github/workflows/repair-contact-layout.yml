name: Repair contact section once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -n "$(grep -c 'class=\"register-address\"' src/components/Landing.astro)"
          grep -q 'contact-socials' src/components/Landing.astro
          grep -q 'fox-tawk-attention' src/styles/site.css
