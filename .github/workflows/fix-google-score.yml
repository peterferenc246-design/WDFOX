name: Fix Google score and crawlability labels
on:
  push:
    paths:
      - '.github/workflows/fix-google-score.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analyzer scoring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/FoxAnalyzerLauncher.astro')
          s=p.read_text()
          # Google score: include the real FOX crawlability result from the top cards,
          # include available Google checks, and never turn unavailable Lighthouse into a failure.
          start=s.find('const setCategoryScore=')
          end=s.find('const filterResults=', start)
          if start<0 or end<0: raise SystemExit('score function markers not found')
          fn='''const setCategoryScore=(r,key)=>{const score=r.querySelector(".score");if(!score)return;const sections=[...r.querySelectorAll(".section")];let cards=[];if(key==="google"){const top=r.querySelector(".top");const crawl=top?[...top.querySelectorAll(".card")].filter(x=>/crawlability|google index/i.test(x.textContent||"")):[];const gs=sections.filter(s=>/google|lighthouse/i.test(s.querySelector("h2")?.textContent||"")).flatMap(s=>[...s.querySelectorAll(".card")]);cards=[...crawl,...gs]}else if(key==="pixel"){const s=sections.find(x=>/meta pixel/i.test(x.querySelector("h2")?.textContent||""));cards=s?[...s.querySelectorAll(".card")]:[]}else if(key==="meta"||key==="twitter"){const s=sections.find(x=>/techn/i.test(x.querySelector("h2")?.textContent||""));const re=key==="meta"?/open graph/i:/twitter cards/i;cards=s?[...s.querySelectorAll(".card")].filter(x=>re.test(x.textContent||"")):[]}else if(key==="security"){const top=r.querySelector(".top");cards=top?[...top.querySelectorAll(".card")].filter(x=>/https/i.test(x.textContent||"")):[]}else{cards=sections.flatMap(s=>[...s.querySelectorAll(".card")].filter(x=>classify(x.textContent,key)))}const checks=cards.filter(x=>x.querySelector("strong.ok")||x.querySelector("strong.bad"));if(!checks.length){score.innerHTML=`<div class="fox-category-scores"><div class="fox-category-score"><small>${categoryName(key)} SCORE 3.0</small><strong>—</strong><p>Žiadne vyhodnotiteľné testy</p></div></div>`;return}const passed=checks.filter(x=>x.querySelector("strong.ok")).length;score.innerHTML=`<div class="fox-category-scores"><div class="fox-category-score"><small>${categoryName(key)} SCORE 3.0</small><strong>${Math.round(passed/checks.length*100)}/100</strong><p>${passed}/${checks.length} vyhodnotených kontrol</p></div></div>`};
'''
          s=s[:start]+fn+s[end:]
          # Make the distinction explicit in the UI.
          s=s.replace('Google crawlability','FOX Crawlability')
          s=s.replace('CrawlabilityFOX','FOX Crawlability')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FoxAnalyzerLauncher.astro
          git commit -m 'fix: correct Google score and label FOX crawlability'
          git push
          rm -f .github/workflows/fix-google-score.yml
          git add .github/workflows/fix-google-score.yml
          git commit -m 'chore: remove temporary Google score workflow' || true
          git push || true
