name: Fix Attention Grabber fox center

on:
  workflow_run:
    workflows: ["Deploy Astro site to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Move fox image to horizontal center
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy.yml')
          text = p.read_text(encoding='utf-8')
          old = text
          replacements = {
              'x=\"110\" y=\"48\" width=\"99\" height=\"84\"': 'x=\"70\" y=\"48\" width=\"100\" height=\"84\"',
              'x=\"110\" y=\"48\" width=\"99\" height=\"84\" preserveAspectRatio=\"none\"': 'x=\"70\" y=\"48\" width=\"100\" height=\"84\" preserveAspectRatio=\"none\"',
          }
          for src, dst in replacements.items():
              text = text.replace(src, dst)
          if text == old:
              raise SystemExit('Current Attention Grabber fox image position not found')
          p.write_text(text, encoding='utf-8')
          PY
          git add .github/workflows/deploy.yml
          git commit -m "Center Attention Grabber fox image"
          git push origin main
      - name: Remove temporary fixer
        run: |
          git rm .github/workflows/fix-tawk-center.yml
          git commit -m "Remove temporary Attention Grabber fixer"
          git push origin main
