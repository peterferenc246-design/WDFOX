name: Fix Attention Grabber fox center

on:
  workflow_run:
    workflows: ["Deploy Astro site to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Move fox image to horizontal center
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('.github/workflows/deploy.yml')
          text = p.read_text(encoding='utf-8')
          pattern = r'<image x=["\'][^"\']+["\'] y=["\']48["\'] width=["\'][^"\']+["\'] height=["\']84["\'] preserveAspectRatio=["\']none["\']'
          replacement = '<image x="70" y="48" width="100" height="84" preserveAspectRatio="none"'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Attention Grabber fox image element not found (matches={count})')
          p.write_text(text, encoding='utf-8')
          PY
          git add .github/workflows/deploy.yml
          git commit -m "Center Attention Grabber fox image"
          git push origin main
      - name: Remove temporary fixer
        run: |
          git rm .github/workflows/fix-tawk-center.yml
          git commit -m "Remove temporary Attention Grabber fixer"
          git push origin main
