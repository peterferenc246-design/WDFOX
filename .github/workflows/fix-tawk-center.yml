name: Fix Attention Grabber fox center

on:
  workflow_run:
    workflows: ["Deploy Astro site to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Move fox to exact center of sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy.yml')
          text = p.read_text(encoding='utf-8')
          old = text
          replacements = {
              'cx="104" cy="94" r="36"': 'cx="120" cy="96" r="36"',
              'translate(104 94) scale(.58)': 'translate(120 96) scale(.58)',
              'cx="160" cy="96" r="36"': 'cx="120" cy="96" r="36"',
              'translate(160 96) scale(.56)': 'translate(120 96) scale(.56)',
          }
          for src, dst in replacements.items():
              text = text.replace(src, dst)
          if text == old:
              raise SystemExit('Expected Attention Grabber fox position not found')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          git commit -m "Center Attention Grabber fox under sentence"
          git push origin main
      - name: Remove temporary fixer
        if: always()
        run: |
          git rm .github/workflows/fix-tawk-center.yml
          git commit -m "Remove temporary Attention Grabber fixer"
          git push origin main