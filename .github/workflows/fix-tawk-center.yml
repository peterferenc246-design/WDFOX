name: Fix Attention Grabber fox center

on:
  workflow_run:
    workflows: ["Deploy Astro site to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply permanent fox centering CSS fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/site.css')
          text = p.read_text(encoding='utf-8')
          rule = '\n/* WDFOX Attention Grabber: center fox under the message */\n#fox-tawk-button .fox-attention-svg image{transform:translateX(-39.5px)!important}\n'
          if '#fox-tawk-button .fox-attention-svg image{transform:translateX(-39.5px)!important}' not in text:
              p.write_text(text.rstrip() + rule, encoding='utf-8')
          else:
              print('Permanent centering rule already present')
          PY
          git add src/styles/site.css
          git commit -m "Center Attention Grabber fox under sentence"
          git push origin main
