name: Fix Freund email recipients on Jobcenter page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fix-freund-email-recipients-2026-10-05.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Freund email recipient metadata
        run: python3 .github/scripts/fix_freund_email_recipients_2026_10_05.py
      - name: Commit source correction
        run: |
          if git diff --quiet -- public/jobcenter-poster-fix.js; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git commit -m 'Correct Freund email recipient metadata and visible Cc list'
          git push origin HEAD:main
# retry after robust recipient patch
