name: Make Freund email collapsible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-collapse-freund-email.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Daniel Freund email collapsible
        run: python3 .github/scripts/collapse_freund_email_section.py
      - name: Commit change
        run: |
          if git diff --quiet -- public/jobcenter-source.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-source.html
          git commit -m 'Make Daniel Freund email collapsible on Jobcenter page'
          git push origin HEAD:main
