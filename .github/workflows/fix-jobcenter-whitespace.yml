name: Fix Jobcenter whitespace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-whitespace.yml'

permissions:
  contents: write

jobs:
  fix-whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove pre-wrap spacing from 04.10 Jobcenter message
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')
          old = '#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding-top:0!important;display:block!important}'
          new = '#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding-top:0!important;display:block!important;white-space:normal!important}'
          if old not in s:
              raise SystemExit('target style not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Jobcenter whitespace caused by pre-wrap'
          git push
