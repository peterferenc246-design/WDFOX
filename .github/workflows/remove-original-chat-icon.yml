name: Remove original chat icon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the original Live chat bubble
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/Landing.astro')
          text = path.read_text(encoding='utf-8')
          target = '<a class="live-chat-bubble" href="#" aria-label="Live chat"><span class="live-chat-icon">✦</span><span>Live chat</span></a>'
          if target not in text:
              raise SystemExit('Original Live chat bubble was not found; refusing unrelated changes.')
          text = text.replace(target, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit requested change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Landing.astro
          git rm .github/workflows/remove-original-chat-icon.yml
          git commit -m "Remove original chat icon"
          git push
