name: Apply requested contact repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair only contact map, social links, and fox background
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          landing = Path('src/components/Landing.astro')
          text = landing.read_text(encoding='utf-8')

          new_contact = r'''<section class="contact-section section-wrap" id="kontakt"><div class="contact-card register-contact-banner"><div class="contact-copy"><p class="eyebrow">{content.contactEyebrow}</p><h2>{content.contactTitle}<br /><em>{content.contactAccent}</em></h2><p>{content.contactDescription}</p><div class="register-contact-identity"><div class="register-person-name"><strong>Peter Ferenc</strong><br /><small>Iniciátor, koordinátor a realizátor</small></div><div class="register-media-row"><img class="register-photo" src="/images/peter-ferenc.jpg" alt="Peter Ferenc" /><div class="register-map-wrap"><iframe class="register-map" title="Mapa adresy Rammelkam 2, 84036 Kumhausen" src="https://www.google.com/maps?q=Rammelkam+2,+84036+Kumhausen,+Germany&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><a class="register-map-link" href="https://www.google.com/maps/search/?api=1&amp;query=Rammelkam+2,+84036+Kumhausen,+Germany" target="_blank" rel="noreferrer">Otvoriť mapu ↗</a></div></div><div class="register-right-details register-contact-details"><div>📧 <strong>E-Mail:</strong> <a href="mailto:info@foxprof.club">info@foxprof.club</a></div><div>🌐 <strong>Web:</strong> <a href="https://foxprof.club/" target="_blank" rel="noreferrer">foxprof.club</a></div><div>📞 <strong>Telefon:</strong> <a href="tel:+4915731733332">+49 157 317 33332</a></div><div>📠 <strong>Fax:</strong> +1 231 538 6409</div></div><div class="register-address"><span>📍</span><div><strong>Anschrift</strong><br />Rammelkam 2<br />84036 Kumhausen<br />Deutschland</div></div></div></div><div class="register-contact-content"><form class="register-contact-form" id="contact-form"><label for="contact-name">Name <span>*</span></label><input id="contact-name" name="name" required /><label for="contact-email">E-Mail <span>*</span></label><input id="contact-email" name="email" type="email" required /><label for="contact-message">Nachricht <span>*</span></label><textarea id="contact-message" name="message" required minlength="5"></textarea><button type="submit">Absenden</button></form><p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p><h4 class="register-follow">Folgen Sie uns</h4><div class="contact-socials"><a href="https://www.facebook.com/StopTelekomKartellEuropa" target="_blank" rel="noopener noreferrer" title="Facebook" aria-label="Facebook">f</a><a href="https://x.com/FOXtiptop" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">X</a><a href="https://www.instagram.com/fiasfoxspravodlivost/" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">IG</a><a href="https://www.linkedin.com/in/foxpro-peter-ferenc-025913196/" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">in</a></div></div></div></section>'''

          pattern = re.compile(r'<section class="contact-section section-wrap" id="kontakt">.*?</section>', re.S)
          updated, count = pattern.subn(new_contact, text, count=1)
          if count != 1:
              raise SystemExit('Contact section not found; refusing unrelated changes.')
          landing.write_text(updated, encoding='utf-8')

          css = Path('src/styles/site.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* WDFOX requested contact repair */'
          if marker not in css_text:
              css_text += r'''

/* WDFOX requested contact repair */
.register-contact-identity{display:grid;gap:1rem;margin-top:1.5rem;}
.register-person-name{font-size:1rem;line-height:1.35;}
.register-person-name strong{font-weight:800;}
.register-person-name small{display:inline-block;margin-top:.2rem;color:#fff;font-size:.82rem;}
.register-media-row{display:flex;align-items:flex-start;gap:1rem;margin-top:.35rem;}
.register-photo{display:block;width:255px;height:170px;object-fit:cover;border-radius:0;flex:0 0 255px;}
.register-map-wrap{width:140px;flex:0 0 140px;}
.register-map{display:block;width:140px;height:290px;border:0;border-radius:12px;background:#e7edf0;}
.register-map-link{display:block;margin-top:.35rem;font-size:.72rem;font-weight:700;text-decoration:underline!important;}
.register-contact-details{display:grid;gap:.55rem;line-height:1.55;margin:0!important;white-space:normal!important;width:auto!important;}
.register-address{margin:0;display:flex;gap:.65rem;line-height:1.55;}
.contact-socials{display:flex;gap:.65rem;margin-top:.75rem;}
.contact-socials a{display:inline-grid!important;place-items:center;width:2rem;height:2rem;border:1px solid rgba(255,255,255,.35);border-radius:50%;text-decoration:none!important;color:#fff!important;}
.contact-socials a:hover{border-color:var(--orange);color:var(--orange)!important;}
@media(max-width:900px){.register-media-row{flex-wrap:wrap}.register-photo{width:min(100%,270px);height:auto;flex-basis:auto}.register-map-wrap{width:min(100%,270px);flex-basis:270px}.register-map{width:100%;height:260px;}}
@media(max-width:760px){.register-media-row{display:grid;grid-template-columns:1fr;}.register-photo{width:100%;max-width:270px}.register-map-wrap{width:100%;max-width:270px}.register-map{width:100%;height:260px;}}

/* The fox PNG contains a white matte. Let multiply blend against the page itself; isolation would preserve the white box. */
#fox-tawk-button .fox-tawk-attention{isolation:auto!important;}
#fox-tawk-button .fox-attention-svg{background:transparent!important;}
#fox-tawk-button .fox-attention-svg image{mix-blend-mode:multiply!important;}
'''
              css.write_text(css_text, encoding='utf-8')
          PY

      - name: Verify requested changes only
        shell: bash
        run: |
          grep -q 'register-map' src/components/Landing.astro
          grep -q 'www.facebook.com/StopTelekomKartellEuropa' src/components/Landing.astro
          grep -q 'x.com/FOXtiptop' src/components/Landing.astro
          grep -q 'www.instagram.com/fiasfoxspravodlivost' src/components/Landing.astro
          grep -q 'www.linkedin.com/in/foxpro-peter-ferenc-025913196' src/components/Landing.astro
          grep -q 'isolation:auto' src/styles/site.css

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Landing.astro src/styles/site.css
          git rm .github/workflows/apply-contact-repair.yml
          git commit -m "Repair contact map social links and fox background"
          git push
