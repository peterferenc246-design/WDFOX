name: Cleanup Jobcenter duplicate intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-jobcenter-duplicate.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate intro block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('              <div style="margin:0;padding:0">\n                <div class="existenz-email-intro"', '              <div class="existenz-email-intro"', 1)
          label = s.find('pdf Beilage:')
          if label < 0:
              raise SystemExit('pdf Beilage label not found')
          dup_start = s.find('                <p style="margin:0 0 10px">anbei übersende ich Ihnen mein Schreiben', label)
          marker = '              <p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>\n'
          dup_end = s.find(marker, dup_start)
          if dup_start < 0 or dup_end < 0:
              raise SystemExit('duplicate block markers not found')
          s = s[:dup_start] + s[dup_end + len(marker):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Remove duplicated Jobcenter intro block'
          git push
