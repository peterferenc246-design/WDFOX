name: Fix Google crawlability test
on:
  push:
    paths:
      - '.github/workflows/fix-google-crawlability.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decouple crawlability from Lighthouse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          # Add a real FOX crawlability evaluator once, independent of Lighthouse.
          marker='async function googleIndexStatus(url){'
          fn='''function foxCrawlability(url,html,head,robots,sitemap){\n  try{\n    const u=new URL(url), h=String(html||''), hd=String(head||''), rb=String(robots||''), sm=String(sitemap||'');\n    const statusOk=/^https?:\\/\\//i.test(u.href);\n    const htmlOk=/<html\\b/i.test(h)&&/<body\\b/i.test(h);\n    const noindex=!/(<meta\\b[^>]*(?:name|property)=["']robots["'][^>]*content=["'][^"']*noindex|<meta\\b[^>]*content=["'][^"']*noindex[^"']*["'][^>]*(?:name|property)=["']robots["'])/i.test(hd+h);\n    const googlebotNoindex=!/(<meta\\b[^>]*(?:name|property)=["']googlebot["'][^>]*content=["'][^"']*noindex|<meta\\b[^>]*content=["'][^"']*noindex[^"']*["'][^>]*(?:name|property)=["']googlebot["'])/i.test(hd+h);\n    const robotsOk=!/^\\s*Disallow:\\s*\\/\\s*$/mi.test(rb);\n    const robotsReadable=rb.trim().length>0;\n    const sitemapReadable=sm.trim().length>0 && /<urlset\\b|<sitemapindex\\b/i.test(sm);\n    return statusOk&&htmlOk&&noindex&&googlebotNoindex&&robotsOk&&robotsReadable&&sitemapReadable;\n  }catch{return false}\n}\n\n'''
          if marker in s and 'function foxCrawlability(' not in s:
              s=s.replace(marker,fn+marker,1)
          # Compute the FOX crawlability result alongside the fetched public documents.
          needle='const [page,head,robots,sitemap,ps,indexed]=await Promise.all(['
          if needle not in s:
              raise SystemExit('Promise.all marker not found')
          # Insert calculation immediately after the Promise.all block, using the existing result variable.
          if 'const crawlOk=foxCrawlability(target,page?.content,head0,robots?.content,sitemap?.content);' not in s:
              close=']);'
              pos=s.find(close,s.find(needle))
              if pos<0: raise SystemExit('Promise.all closing marker not found')
              pos += len(close)
              s=s[:pos]+'\nconst crawlOk=foxCrawlability(target,page?.content,head0,robots?.content,sitemap?.content);'+s[pos:]
          # Replace Lighthouse's is-crawlable audit wherever it is used for the crawlability card.
          patterns=[
            r"ps\\?\\.lighthouseResult\\?\\.audits\\?\\.\[['\"]is-crawlable['\"]\]\\?\\.score===1",
            r"ps\\?\\.lighthouseResult\\?\\.audits\\?\\.\[['\"]is-crawlable['\"]\]\\?\\.score == 1",
            r"ps\\?\\.lighthouseResult\\?\\.audits\\?\\.\[['\"]is-crawlable['\"]\]\\?\\.score"
          ]
          changed=False
          for pat in patterns:
              ns,n=re.subn(pat,'crawlOk',s)
              if n: s=ns; changed=True
          # Also correct the metric label so crawlability is no longer branded as Lighthouse.
          s=s.replace("crawl:'Lighthouse'","crawl:'FOX'")
          s=s.replace("crawlMetric:'Crawlability'","crawlMetric:'Crawlability'")
          if not changed:
              # If the current compact source already computes crawlability differently, do not silently claim a fix.
              raise SystemExit('Could not find Lighthouse crawlability expression to replace')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git commit -m 'fix: decouple Google crawlability from Lighthouse' || true
          git push
          rm -f .github/workflows/fix-google-crawlability.yml
          git add .github/workflows/fix-google-crawlability.yml
          git commit -m 'chore: remove temporary crawlability fix workflow' || true
          git push
