name: WDFOX OneNote Documentation Agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install msal requests
      - name: Document changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONENOTE_CHANGE_SECTION_ID: ${{ secrets.ONENOTE_CHANGE_SECTION_ID }}
          MSAL_CACHE_B64: ${{ secrets.MSAL_CACHE_B64 }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
        run: python tools/onenote_agent.py
