name: Format Jobcenter Existenz v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-jobcenter-existenz-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact message formatting
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Format 04.10 Jobcenter message exactly as requested'
          git push
