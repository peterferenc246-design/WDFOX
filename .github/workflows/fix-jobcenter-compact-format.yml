name: Fix Jobcenter compact format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-compact-format.yml'

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize compact 04.10 Jobcenter message layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div style="font-weight:700;margin:0 0 4px">postfachnachricht-04.10.2026 15_21</div>', '<div style="font-weight:700;margin:0">postfachnachricht-04.10.2026 15_21</div>', 1)
          s = s.replace('<p style="margin:0 0 4px">meine Situation ist inzwischen keine Frage weiteren Wartens, weiterer Erklärungen oder der fortlaufenden Ausgabe einzelner Gutscheine mehr.', '<p style="margin:0">meine Situation ist inzwischen keine Frage weiteren Wartens, weiterer Erklärungen oder der fortlaufenden Ausgabe einzelner Gutscheine mehr.', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Jobcenter compact spacing'
          git push
