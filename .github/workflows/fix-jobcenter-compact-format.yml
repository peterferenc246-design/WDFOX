name: Fix Jobcenter compact format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-compact-format.yml'

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact 04.10 Jobcenter message layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/jobcenter-poster-fix.js')
          s = p.read_text(encoding='utf-8')
          old = '''              <div class="existenz-email-intro" style="margin:0;padding:0;line-height:1.28;white-space:normal">
                <div style="font-weight:700;margin:0 0 4px">postfachnachricht-04.10.2026 15_21</div>
                <p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>
                <p style="margin:0">anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>
                <p style="margin:0">Mit freundlichen Grüßen<br>Peter Ferenc</p>
                <div data-wdfox-reference-links="1" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0;line-height:1.2">
                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a>
                  <a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>
                </div>
                <div style="font-family:monospace;color:#666;overflow:hidden;white-space:nowrap;margin:0">======================================================</div>
                <div style="font-weight:700;margin:0">pdf Beilage:</div>
              </div>
              <p style="margin:0 0 10px">Sehr geehrte Damen und Herren,</p>'''
          new = '''              <div class="existenz-email-intro" style="margin:0;padding:0;line-height:1.28;white-space:normal">
                <div style="font-weight:700;margin:0">postfachnachricht-04.10.2026 15_21</div>
                <p style="margin:0">Sehr geehrte Damen und Herren,</p>
                <p style="margin:0">anbei übersende ich Ihnen mein Schreiben zur unverzüglichen finanziellen Sicherung meiner Existenz sowie zur Unterstützung bei der Aufnahme meiner selbständigen Tätigkeit. Ich bitte um sofortige Bearbeitung und um eine schriftliche Bestätigung der darin genannten Maßnahmen und Fristen.</p>
                <p style="margin:0">Mit freundlichen Grüßen<br>Peter Ferenc</p>
                <div data-wdfox-reference-links="1" style="margin:0;line-height:1.2;white-space:normal">
                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a><span> </span><a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>
                </div>
                <div style="font-family:monospace;color:#666;overflow:hidden;white-space:nowrap;margin:0">======================================================</div>
                <div style="font-weight:700;margin:0">pdf Anhang:</div>
              </div>
              <p style="margin:0">Sehr geehrte Damen und Herren,</p>'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Match Jobcenter message spacing and Anhang label'
          git push
