name: Apply requested contact repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested repair
        env:
          CONTACT_B64: " aria-live="polite"></p><h4 class="register-follow">Folgen Sie uns</h4><div class="contact-socials"><a href="https://www.facebook.com/StopTelekomKartellEuropa" target="_blank" rel="noopener noreferrer" title="Facebook" aria-label="Facebook">f</a><a href="https://x.com/FOXtiptop" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">X</a><a href="https://www.instagram.com/fiasfoxspravodlivost/" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">IG</a><a href="https://www.linkedin.com/in/foxpro-peter-ferenc-025913196/" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">in</a></div></div></div></section>
          CSS_B64: 
        run: |
          printf '%s' "$CONTACT_B64" | base64 -d > /tmp/contact.html
          printf '%s' "$CSS_B64" | base64 -d > /tmp/repair.css
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/Landing.astro')
          t=p.read_text(encoding='utf-8')
          n=Path('/tmp/contact.html').read_text(encoding='utf-8')
          t,c=re.subn(r'<section class="contact-section section-wrap" id="kontakt">.*?</section>',n,t,count=1,flags=re.S)
          if c != 1: raise SystemExit('contact section not found')
          p.write_text(t,encoding='utf-8')
          c=Path('src/styles/site.css')
          c.write_text(c.read_text(encoding='utf-8')+'\n'+Path('/tmp/repair.css').read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Landing.astro src/styles/site.css
          git commit -m "Repair contact map social links and fox background"
          git push
