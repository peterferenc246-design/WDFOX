name: Fix Jobcenter PDF links and spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-pdf-links-spacing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-jobcenter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested Jobcenter layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/jobcenter-poster-fix.js')
          text = path.read_text(encoding='utf-8')
          old_block = '              <div style="border-top:1px solid #d9d9d9;padding-top:12px;margin-top:4px">\n                <div style="font-weight:700;margin:0 0 10px">postfachnachricht-04.10.2026 15_21</div>\n                <div id="existenz-postfach-pdf-text" style="line-height:1.45;text-align:justify;text-justify:inter-word;hyphens:auto">Text aus dem Original-PDF wird geladen ...</div>\n              </div>\n'
          text = text.replace(old_block, '')
          marker = '            <div class="outlook-view-body" style="padding:16px 18px;line-height:1.45;text-align:justify;text-justify:inter-word;hyphens:auto">\n'
          block = marker + '              <div style="border-top:1px solid #d9d9d9;padding-top:3px;margin-top:0;margin-bottom:5px">\n' + '                <div style="font-weight:700;margin:0 0 3px">postfachnachricht-04.10.2026 15_21</div>\n' + '                <div data-wdfox-reference-links="1" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0 0 5px;line-height:1.25">\n' + '                  <a href="${JOBCENTER_PAGE_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.foxprof.club/jobcenter/</a>\n' + '                  <a href="${EXISTENZ_REFERENCE_FACEBOOK_URL}" target="_blank" rel="noopener noreferrer" style="color:#0b57d0;text-decoration:underline;word-break:break-all">https://www.facebook.com/photo?fbid=980105415133071&amp;set=a.858080437335570</a>\n' + '                </div>\n' + '                <div id="existenz-postfach-pdf-text" style="line-height:1.28;text-align:justify;text-justify:inter-word;hyphens:auto;margin:0 0 5px">Text aus dem Original-PDF wird geladen ...</div>\n' + '              </div>\n'
          if marker not in text:
              raise SystemExit('Jobcenter body marker not found')
          text = text.replace(marker, block, 1)
          text = text.replace('style="margin:0 0 10px"', 'style="margin:0 0 4px"')
          text = text.replace('style="margin:0 0 12px"', 'style="margin:0 0 5px"')
          text = text.replace('<ul style="padding-left:24px;margin:4px 0 12px">', '<ul style="padding-left:24px;margin:2px 0 5px">')
          text = text.replace('style="margin-bottom:6px"', 'style="margin-bottom:2px"')
          path.write_text(text, encoding='utf-8')
          astro = Path('src/pages/jobcenter/index.astro')
          if astro.exists():
              css = astro.read_text(encoding='utf-8')
              css = css.replace('#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding:10px 14px!important;line-height:1.28!important}', '#jobcenter-existenz-message-2026-10-04 .outlook-view-body{padding:8px 14px!important;line-height:1.28!important}')
              css = css.replace('#jobcenter-existenz-message-2026-10-04 .outlook-view-body ul,#jobcenter-existenz-message-2026-10-04 .outlook-view-body ol{margin:1px 0 5px!important}', '#jobcenter-existenz-message-2026-10-04 .outlook-view-body ul,#jobcenter-existenz-message-2026-10-04 .outlook-view-body ol{margin:1px 0 4px!important}')
              astro.write_text(css, encoding='utf-8')
          PY
      - name: Commit requested Jobcenter fix
        shell: bash
        run: |
          if git diff --quiet -- public/jobcenter-poster-fix.js src/pages/jobcenter/index.astro; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js src/pages/jobcenter/index.astro
          git commit -m 'Place Jobcenter reference links and remove excess gaps'
          git push
