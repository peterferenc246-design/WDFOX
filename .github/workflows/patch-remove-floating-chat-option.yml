name: One-time remove obsolete floating chat option

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_floating_chat_option.py'
      - '.github/workflows/patch-remove-floating-chat-option.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/patch_remove_floating_chat_option.py

      - name: Commit loader fix
        run: |
          git config user.name "WDFOX Tawk Bot"
          git config user.email "actions@github.com"
          git add public/tawk-language-loader.js
          git commit -m "Remove obsolete floating chat option"
          git push origin main
