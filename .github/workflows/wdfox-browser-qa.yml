name: WDFOX Browser QA

run-name: WDFOX Browser QA

on:
  workflow_dispatch:
    inputs:
      qa_type:
        description: "visual or functional"
        required: true
        type: choice
        options: [visual, functional]
      stage:
        description: "preview, production-candidate or live"
        required: true
        default: preview
      target_url:
        description: "URL to test"
        required: true
      approved_preview_commit:
        description: "Approved PREVIEW SHA"
        required: true
      request_id:
        description: "Unique request id"
        required: true
      external_preview:
        description: "For preview, test target_url instead of localhost exact build"
        required: false
        default: false
        type: boolean
  push:
    branches: [qa-requests]
    paths:
      - "ops/qa/requests/*.json"

permissions:
  contents: write

jobs:
  browser-qa:
    name: Playwright Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Resolve QA request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_QA_TYPE: ${{ inputs.qa_type }}
          WD_STAGE: ${{ inputs.stage }}
          WD_TARGET_URL: ${{ inputs.target_url }}
          WD_APPROVED: ${{ inputs.approved_preview_commit }}
          WD_REQUEST_ID: ${{ inputs.request_id }}
          WD_EXTERNAL_PREVIEW: ${{ inputs.external_preview }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            request_path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ops/qa/requests/.*\.json$' | tail -n 1)"
            [[ -n "$request_path" && -f "$request_path" ]] || { echo "QA request file not found"; exit 2; }
            QA_TYPE="$(jq -r '.qa_type // empty' "$request_path")"
            STAGE="$(jq -r '.stage // empty' "$request_path")"
            TARGET_URL="$(jq -r '.target_url // empty' "$request_path")"
            APPROVED="$(jq -r '.approved_preview_commit // empty' "$request_path")"
            REQUEST_ID="$(jq -r '.request_id // empty' "$request_path")"
            EXTERNAL_PREVIEW="$(jq -r '.external_preview // false' "$request_path")"
          else
            QA_TYPE="$WD_QA_TYPE"
            STAGE="$WD_STAGE"
            TARGET_URL="$WD_TARGET_URL"
            APPROVED="$WD_APPROVED"
            REQUEST_ID="$WD_REQUEST_ID"
            EXTERNAL_PREVIEW="${WD_EXTERNAL_PREVIEW:-false}"
          fi

          [[ "$QA_TYPE" == "visual" || "$QA_TYPE" == "functional" ]] || { echo "Invalid qa_type"; exit 2; }
          [[ "$STAGE" == "preview" || "$STAGE" == "production-candidate" || "$STAGE" == "live" ]] || { echo "Invalid stage"; exit 2; }
          [[ "$APPROVED" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid approved preview SHA"; exit 2; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{3,120}$ ]] || { echo "Invalid request_id"; exit 2; }
          [[ "$TARGET_URL" =~ ^https:// ]] || { echo "target_url must use https"; exit 2; }
          [[ "$EXTERNAL_PREVIEW" == "true" || "$EXTERNAL_PREVIEW" == "false" ]] || { echo "external_preview must be boolean"; exit 2; }

          echo "qa_type=$QA_TYPE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "external_preview=$EXTERNAL_PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Checkout runner code from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout exact approved PREVIEW commit
        if: steps.request.outputs.stage == 'preview'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.approved }}
          path: preview-under-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact approved PREVIEW commit
        if: steps.request.outputs.stage == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          cd preview-under-test
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install isolated Playwright Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=/tmp/wdfox-browser-qa-runtime
          rm -rf "$RUNTIME"
          mkdir -p "$RUNTIME"
          cp .github/scripts/wdfox_browser_qa_v2.mjs "$RUNTIME/wdfox_browser_qa_v2.mjs"
          cd "$RUNTIME"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Run browser QA
        shell: bash
        env:
          QA_TYPE: ${{ steps.request.outputs.qa_type }}
          STAGE: ${{ steps.request.outputs.stage }}
          REQUEST_TARGET_URL: ${{ steps.request.outputs.target_url }}
          APPROVED_PREVIEW_COMMIT: ${{ steps.request.outputs.approved }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          EXTERNAL_PREVIEW: ${{ steps.request.outputs.external_preview }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/qa-artifacts"
          RUN_TARGET="$REQUEST_TARGET_URL"

          if [[ "$STAGE" == "preview" && "$EXTERNAL_PREVIEW" != "true" ]]; then
            cd "$GITHUB_WORKSPACE/preview-under-test"
            nohup pnpm exec astro preview --host 127.0.0.1 --port 4321 > "$GITHUB_WORKSPACE/qa-artifacts/preview-server.log" 2>&1 &
            preview_pid=$!
            echo "$preview_pid" > "$GITHUB_WORKSPACE/qa-artifacts/preview-server.pid"
            RUN_TARGET="http://127.0.0.1:4321/"
            ready=0
            for i in $(seq 1 45); do
              if curl --silent --fail "$RUN_TARGET" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              echo "Exact PREVIEW build did not become reachable" >&2
              cat "$GITHUB_WORKSPACE/qa-artifacts/preview-server.log" || true
              exit 2
            fi
          fi

          cd /tmp/wdfox-browser-qa-runtime
          TARGET_URL="$RUN_TARGET" QA_OUT_DIR="$GITHUB_WORKSPACE/qa-artifacts" node ./wdfox_browser_qa_v2.mjs
          code=$?
          cd "$GITHUB_WORKSPACE"
          echo "runner_exit=$code" >> "$GITHUB_ENV"
          test -s qa-artifacts/report.json || {
            jq -n \
              --arg request_id "$REQUEST_ID" \
              --arg qa_type "$QA_TYPE" \
              --arg stage "$STAGE" \
              --arg target_url "$RUN_TARGET" \
              --arg approved "$APPROVED_PREVIEW_COMMIT" \
              '{schema:"wdfox-browser-qa/v2",request_id:$request_id,qa_type:$qa_type,stage:$stage,target_url:$target_url,approved_preview_commit:$approved,verdict:"FAIL",failures:["runner did not produce report"],results:[]}' \
              > qa-artifacts/report.json
          }
          exit 0

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wdfox-${{ steps.request.outputs.qa_type }}-${{ steps.request.outputs.request_id }}
          path: qa-artifacts/
          retention-days: 14

      - name: Persist machine-readable result to qa-results branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TYPE: ${{ steps.request.outputs.qa_type }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          report_b64="$(base64 -w0 qa-artifacts/report.json)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/qa/results/${REQUEST_ID}-${QA_TYPE}.json"
          existing="$(curl --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}?ref=qa-results")"
          existing_sha="$(jq -r '.sha // empty' <<<"$existing")"
          if [[ -n "$existing_sha" ]]; then
            payload="$(jq -n --arg msg "Browser QA ${REQUEST_ID} ${QA_TYPE}" --arg content "$report_b64" --arg sha "$existing_sha" '{message:$msg,content:$content,branch:"qa-results",sha:$sha}')"
          else
            payload="$(jq -n --arg msg "Browser QA ${REQUEST_ID} ${QA_TYPE}" --arg content "$report_b64" '{message:$msg,content:$content,branch:"qa-results"}')"
          fi
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$payload"

      - name: Enforce QA verdict
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' qa-artifacts/report.json)"
          cat qa-artifacts/report.json >> "$GITHUB_STEP_SUMMARY"
          [[ "$verdict" == "PASS" ]]
