name: WDFOX Browser QA

run-name: WDFOX Browser QA ${{ github.event.client_payload.request_id || inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      qa_type:
        description: "visual or functional"
        required: true
        type: choice
        options: [visual, functional]
      stage:
        description: "preview, production-candidate or live"
        required: true
        default: preview
      target_url:
        description: "URL to test"
        required: true
      approved_preview_commit:
        description: "Approved PREVIEW SHA"
        required: true
      request_id:
        description: "Unique request id"
        required: true
  repository_dispatch:
    types: [wdfox_browser_qa]

permissions:
  contents: write

env:
  QA_TYPE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.qa_type || inputs.qa_type }}
  STAGE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.stage || inputs.stage }}
  TARGET_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_url || inputs.target_url }}
  APPROVED_PREVIEW_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.approved_preview_commit || inputs.approved_preview_commit }}
  REQUEST_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id || inputs.request_id }}
  QA_OUT_DIR: qa-artifacts

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA_TYPE" == "visual" || "$QA_TYPE" == "functional" ]]
          [[ "$STAGE" == "preview" || "$STAGE" == "production-candidate" || "$STAGE" == "live" ]]
          [[ "$APPROVED_PREVIEW_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{3,120}$ ]]
          [[ "$TARGET_URL" =~ ^https:// ]]

      - name: Checkout runner code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser QA
        shell: bash
        run: |
          set +e
          node .github/scripts/wdfox_browser_qa.mjs
          code=$?
          echo "runner_exit=$code" >> "$GITHUB_ENV"
          test -s qa-artifacts/report.json || {
            mkdir -p qa-artifacts
            printf '%s\n' '{"schema":"wdfox-browser-qa/v1","verdict":"FAIL","failures":["runner did not produce report"]}' > qa-artifacts/report.json
          }
          exit 0

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wdfox-${{ env.QA_TYPE }}-${{ env.REQUEST_ID }}
          path: qa-artifacts/
          retention-days: 14

      - name: Persist machine-readable result to qa-results branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_b64="$(base64 -w0 qa-artifacts/report.json)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/qa/results/${REQUEST_ID}-${QA_TYPE}.json"
          payload="$(jq -n --arg msg "Browser QA ${REQUEST_ID} ${QA_TYPE}" --arg content "$report_b64" '{message:$msg,content:$content,branch:"qa-results"}')"
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$payload"

      - name: Enforce QA verdict
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' qa-artifacts/report.json)"
          cat qa-artifacts/report.json >> "$GITHUB_STEP_SUMMARY"
          [[ "$verdict" == "PASS" ]]
