name: Fix Jobcenter excess gaps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jobcenter-gaps.yml'

permissions:
  contents: write

jobs:
  fix-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Jobcenter spacing
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobcenter-poster-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Remove remaining excess gaps in Jobcenter message'
          git push
