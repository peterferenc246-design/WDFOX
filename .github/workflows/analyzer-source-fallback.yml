name: Analyzer source fallback
on:
  push:
    branches: [main]
jobs:
  fix:
    if: "${{ github.event.head_commit.message != 'fix: add robust analyzer HTML fallback' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Patch analyzer
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text(encoding='utf-8')
          old="""async function jina(url,head=false){const target=new URL(url,location.href),same=target.hostname.toLowerCase().replace(/^www\\./,'')===location.hostname.toLowerCase().replace(/^www\\./,'');if(same){const local=new URL(target.pathname+target.search,location.origin),r=await fetch(local.href,{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('local');return{content:await r.text(),url:r.url||local.href}}const h={Accept:'application/json','X-No-Cache':'true'};if(head){h['X-Respond-With']='html';h['X-Engine']='browser';h['X-Respond-Timing']='html';}const r=await fetch('https://r.jina.ai/'+url,{headers:h});if(!r.ok)throw Error('jina');const raw=await r.text();try{const j=JSON.parse(raw),d=j?.data||j;return{...d,content:String(d?.content||'')}}catch{return{content:raw}}}
"""
          new="""async function jina(url,head=false,engine='browser'){const target=new URL(url,location.href),same=target.hostname.toLowerCase().replace(/^www\\./,'')===location.hostname.toLowerCase().replace(/^www\\./,'');if(same){const local=new URL(target.pathname+target.search,location.origin),r=await fetch(local.href,{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('local');return{content:await r.text(),url:r.url||local.href}}const h={Accept:'application/json','X-No-Cache':'true'};if(head){h['X-Respond-With']='html';h['X-Engine']=engine;h['X-Respond-Timing']='html';}const r=await fetch('https://r.jina.ai/'+url,{headers:h});if(!r.ok)throw Error('jina');const raw=await r.text();try{const j=JSON.parse(raw),d=j?.data||j;return{...d,content:String(d?.content||'')}}catch{return{content:raw}}}
async function jinaHead(url){const browser=await jina(url,true,'browser').catch(()=>({content:''}));if(/<html\\b/i.test(String(browser.content||''))||/<head\\b/i.test(String(browser.content||'')))return browser;const direct=await jina(url,true,'direct').catch(()=>({content:''}));return /<html\\b/i.test(String(direct.content||''))||/<head\\b/i.test(String(direct.content||''))?direct:browser}
"""
          if old not in s:
            raise SystemExit('jina block not found')
          s=s.replace(old,new,1)
          s=s.replace("let head0=await jina(target,true).catch(()=>({content:''}));", "let head0=await jinaHead(target);")
          p.write_text(s,encoding='utf-8')
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/analyzer-source-fallback.yml .deploy-analyzer-source-fallback
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/analyzer.astro .github/workflows/analyzer-source-fallback.yml .deploy-analyzer-source-fallback
          git commit -m "fix: add robust analyzer HTML fallback"
          git push
