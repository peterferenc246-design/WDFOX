name: Fix Google crawlability test 4
on:
  push:
    paths:
      - '.github/workflows/fix-google-crawlability-4.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply crawlability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/analyzer.astro')
          s=p.read_text()
          fn="""function foxCrawlability(url,html,head,robots){
            try{
              const u=new URL(url),h=String(html||''),hd=String(head||''),rb=String(robots||'');
              const publicUrl=/^https?:\\/\\//i.test(u.href);
              const htmlOk=/<html\\b/i.test(h)&&/<body\\b/i.test(h);
              const noindex=!/(<meta\\b[^>]*(?:name|property)=[\"'](?:robots|googlebot)[\"'][^>]*content=[\"'][^\"']*noindex|<meta\\b[^>]*content=[\"'][^\"']*noindex[^\"']*[\"'][^>]*(?:name|property)=[\"'](?:robots|googlebot)[\"'])/i.test(hd+h);
              const groups=[];let agents=[],dis=[];
              for(const line of rb.split(/\\r?\\n/)){
                const x=line.replace(/#.*/, '').trim();if(!x)continue;
                const a=x.match(/^User-agent:\\s*(.+)$/i);
                if(a){if(agents.length)groups.push({agents,dis});agents=[a[1].trim().toLowerCase()];dis=[];continue}
                const d=x.match(/^Disallow:\\s*(.*)$/i);if(d)dis.push(d[1].trim());
              }
              if(agents.length)groups.push({agents,dis});
              const relevant=groups.filter(g=>g.agents.includes('googlebot')||g.agents.includes('*'));
              const blocked=relevant.some(g=>g.dis.includes('/'));
              return publicUrl&&htmlOk&&noindex&&(rb.trim().length===0||!blocked);
            }catch{return false}
          }

          """
          marker='async function googleIndexStatus(url){'
          if 'function foxCrawlability(' not in s:
              s=s.replace(marker,fn+marker,1)
          s=s.replace("crawl=pass('is-crawlable')","crawl=foxCrawlability(target,html,head0,robots.content)",1)
          s=s.replace("card(t.cards.crawl,crawl,t.lh)","card(t.cards.crawl,crawl,'FOX')",1)
          s=s.replace("crawl:'Lighthouse'","crawl:'FOX'")
          p.write_text(s)
          print('crawl fix applied')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/analyzer.astro
          git commit -m 'fix: decouple Google crawlability from Lighthouse' || true
          git push || true
          rm -f .github/workflows/fix-google-crawlability.yml .github/workflows/fix-google-crawlability-2.yml .github/workflows/fix-google-crawlability-3.yml .github/workflows/fix-google-crawlability-4.yml
          git add .github/workflows/fix-google-crawlability.yml .github/workflows/fix-google-crawlability-2.yml .github/workflows/fix-google-crawlability-3.yml .github/workflows/fix-google-crawlability-4.yml
          git commit -m 'chore: remove temporary crawlability workflows' || true
          git push || true
