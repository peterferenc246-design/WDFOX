name: WDFOX Tawk Deploy Agent

on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect or sync"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - sync
      source_branch:
        description: "Source branch"
        required: true
        default: "preview"
      target_branch:
        description: "Target branch"
        required: true
        default: "main"
      confirm:
        description: "For production sync enter DEPLOY_TAWK_TO_MAIN"
        required: false
        default: ""
  repository_dispatch:
    types: [wdfox_tawk_agent]

permissions:
  contents: write

env:
  DEFAULT_SOURCE: preview
  DEFAULT_TARGET: main

concurrency:
  group: wdfox-tawk-production
  cancel-in-progress: false

jobs:
  agent:
    name: WDFOX Tawk Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_ACTION: ${{ inputs.action }}
          WD_SOURCE: ${{ inputs.source_branch }}
          WD_TARGET: ${{ inputs.target_branch }}
          WD_CONFIRM: ${{ inputs.confirm }}
          RD_ACTION: ${{ github.event.client_payload.action }}
          RD_SOURCE: ${{ github.event.client_payload.source_branch }}
          RD_TARGET: ${{ github.event.client_payload.target_branch }}
          RD_CONFIRM: ${{ github.event.client_payload.confirm }}
          RD_REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            ACTION="${RD_ACTION:-inspect}"
            SOURCE="${RD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${RD_TARGET:-$DEFAULT_TARGET}"
            CONFIRM="${RD_CONFIRM:-}"
            REQUEST_ID="${RD_REQUEST_ID:-n8n}"
          else
            ACTION="${WD_ACTION:-inspect}"
            SOURCE="${WD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${WD_TARGET:-$DEFAULT_TARGET}"
            CONFIRM="${WD_CONFIRM:-}"
            REQUEST_ID="manual"
          fi

          [[ "$ACTION" == "inspect" || "$ACTION" == "sync" ]] || { echo "Unsupported action: $ACTION"; exit 2; }
          [[ "$SOURCE" == "preview" ]] || { echo "Only source_branch=preview is allowed"; exit 2; }
          [[ "$TARGET" == "main" ]] || { echo "Only target_branch=main is allowed"; exit 2; }

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

          {
            echo "## WDFOX Tawk Agent request"
            echo "- Request ID: \`$REQUEST_ID\`"
            echo "- Action: \`$ACTION\`"
            echo "- Source: \`$SOURCE\`"
            echo "- Target: \`$TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.target }}
          fetch-depth: 0

      - name: Fetch tested preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.request.outputs.source }}:${{ steps.request.outputs.source }}"
          echo "source_sha=$(git rev-parse '${{ steps.request.outputs.source }}')" >> "$GITHUB_ENV"
          echo "target_sha=$(git rev-parse '${{ steps.request.outputs.target }}')" >> "$GITHUB_ENV"

      - name: Generate production candidates from tested preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdfox-tawk-sync
          git show "${{ steps.request.outputs.source }}:public/tawk-preview-external.js" > /tmp/wdfox-tawk-sync/tawk-preview-external.js
          git show "${{ steps.request.outputs.source }}:public/tawk-preview-launcher.js" > /tmp/wdfox-tawk-sync/tawk-preview-launcher.js
          git show "${{ steps.request.outputs.source }}:public/images/tawk-fox-face-transparent.png" > /tmp/wdfox-tawk-sync/tawk-fox-face-transparent.png

          python3 <<'PY'
          from pathlib import Path

          root = Path('/tmp/wdfox-tawk-sync')

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f"Expected marker missing in {label}: {needle!r}")

          # Build production loader from the tested preview loader while preserving
          # production-only language-switch behavior and removing preview host guards.
          external = (root / 'tawk-preview-external.js').read_text(encoding='utf-8')
          host_block = '''
  var host = String(window.location.hostname || "").toLowerCase();
  var isPreviewHost =
    host === "localhost" ||
    host === "127.0.0.1" ||
    host.endsWith(".app.github.dev") ||
    host.endsWith(".github.dev");

  if (!isPreviewHost) return;
'''
          require(external, host_block, 'preview external loader')
          external = external.replace(host_block, '', 1)
          external = external.replace(
              '/* WDFOX preview: external Tawk.to connection only. */',
              '/* WDFOX production: external Tawk.to connection mirrored from tested preview. */',
              1,
          )
          external = external.replace('fox-tawk-preview-concealed', 'fox-tawk-concealed')
          external = external.replace('fox-tawk-preview-no-flash', 'fox-tawk-no-flash')
          external = external.replace(
              'script.setAttribute("data-wdfox-preview", "external-tawk");',
              'script.setAttribute("data-wdfox-production", "external-tawk");',
              1,
          )

          widget_marker = '  var widgetId = WIDGETS[language];\n'
          require(external, widget_marker, 'preview external loader')
          external = external.replace(
              widget_marker,
              widget_marker + '\n  try { localStorage.setItem("wdfox-language", language); } catch (_) {}\n',
              1,
          )

          globals_marker = '''
  window.WebDesignFOXTawkWidgetId = widgetId;
'''
          require(external, globals_marker, 'preview external loader')
          switch_block = '''

  window.WebDesignFOXSwitchChatLanguage = function (nextLanguage, done) {
    var next = normalize(nextLanguage);
    if (WIDGETS[next]) {
      try { localStorage.setItem("wdfox-language", next); } catch (_) {}
    }
    var finish = function () {
      if (typeof done === "function") done();
    };
    try {
      if (window.Tawk_API && typeof window.Tawk_API.endChat === "function") {
        window.Tawk_API.endChat();
        window.setTimeout(finish, 120);
        return;
      }
    } catch (_) {}
    finish();
  };
'''
          external = external.replace(globals_marker, globals_marker + switch_block, 1)
          (root / 'tawk-language-loader.js').write_text(external, encoding='utf-8')

          # Build production FOX launcher from the tested preview launcher.
          launcher = (root / 'tawk-preview-launcher.js').read_text(encoding='utf-8')
          launcher_host_block = '''
  var host = String(window.location.hostname || "").toLowerCase();
  var isPreviewHost = host === "localhost" || host === "127.0.0.1" || host.endsWith(".app.github.dev") || host.endsWith(".github.dev");
  if (!isPreviewHost) return;
'''
          require(launcher, launcher_host_block, 'preview launcher')
          launcher = launcher.replace(launcher_host_block, '', 1)
          launcher = launcher.replace(
              '/* WDFOX Codespaces-only Tawk.to launcher — restored original FOX artwork. */',
              '/* WDFOX production Tawk.to launcher — exact behavior mirrored from tested preview. */',
              1,
          )
          launcher = launcher.replace('fox-tawk-preview-launcher', 'fox-tawk-launcher')
          launcher = launcher.replace('fox-tawk-preview-concealed', 'fox-tawk-concealed')
          launcher = launcher.replace('fox-preview-arc', 'fox-prod-arc')
          launcher = launcher.replace('fox-tawk-launcher-style', 'fox-tawk-production-launcher-style', 1)

          css_marker = '    "#fox-tawk-launcher svg *{pointer-events:none!important}" +\n'
          require(launcher, css_marker, 'preview launcher')
          launcher = launcher.replace(
              css_marker,
              css_marker + '    ".live-chat-bubble:not(#fox-tawk-launcher){display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}" +\n',
              1,
          )
          (root / 'tawk-native-force.js').write_text(launcher, encoding='utf-8')
          PY

      - name: Validate generated production candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync

          for id in 1k1b9121q 1k1bb2aln 1k1bb9ast 1k1bjvbjq 1k1blk6o4 1k1bovo5t 1k1bp5qda 1k1bp6lk5 1k1bpdngj; do
            grep -Fq "$id" "$ROOT/tawk-language-loader.js"
            grep -Fq "$id" "$ROOT/tawk-native-force.js"
          done

          grep -Fq 'window.WebDesignFOXSwitchChatLanguage' "$ROOT/tawk-language-loader.js"
          grep -Fq 'id = "fox-tawk-launcher"' "$ROOT/tawk-native-force.js"
          grep -Fq '.live-chat-bubble:not(#fox-tawk-launcher)' "$ROOT/tawk-native-force.js"

          if grep -Fq 'isPreviewHost' "$ROOT/tawk-language-loader.js" || grep -Fq 'isPreviewHost' "$ROOT/tawk-native-force.js"; then
            echo "Blocked: preview host guard leaked into production candidate"
            exit 4
          fi
          if grep -Fq 'fox-tawk-preview-' "$ROOT/tawk-language-loader.js" || grep -Fq 'fox-tawk-preview-' "$ROOT/tawk-native-force.js"; then
            echo "Blocked: preview-only DOM identifiers leaked into production candidate"
            exit 4
          fi

          test -s "$ROOT/tawk-language-loader.js"
          test -s "$ROOT/tawk-native-force.js"
          grep -Fq '/tawk-native-force.js' public/cunderlik-gallery-runtime.js

          file "$ROOT/tawk-fox-face-transparent.png" | grep -qi 'PNG image data'

      - name: Inspect preview-to-production sync
        if: steps.request.outputs.action == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          {
            echo "### Preview → production candidate status"
            echo "- Preview SHA: \`$source_sha\`"
            echo "- Production SHA: \`$target_sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          check_file() {
            local current="$1"
            local candidate="$2"
            if cmp -s "$current" "$candidate"; then
              echo "- ✅ \`$current\` already matches the generated production candidate" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- 🔄 \`$current\` would be updated" >> "$GITHUB_STEP_SUMMARY"
              git diff --no-index --stat -- "$current" "$candidate" || true
            fi
          }

          check_file public/tawk-language-loader.js "$ROOT/tawk-language-loader.js"
          check_file public/tawk-native-force.js "$ROOT/tawk-native-force.js"
          check_file public/images/tawk-fox-face-transparent.png "$ROOT/tawk-fox-face-transparent.png"

      - name: Validate production sync confirmation
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.request.outputs.confirm }}" == "DEPLOY_TAWK_TO_MAIN" ]] || {
            echo "Production confirmation missing. Expected DEPLOY_TAWK_TO_MAIN"
            exit 5
          }

      - name: Apply generated Tawk production candidates
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          cp "$ROOT/tawk-language-loader.js" public/tawk-language-loader.js
          cp "$ROOT/tawk-native-force.js" public/tawk-native-force.js
          cp "$ROOT/tawk-fox-face-transparent.png" public/images/tawk-fox-face-transparent.png

      - name: Enforce production change scope
        if: steps.request.outputs.action == 'sync'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No production changes are necessary." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              public/tawk-language-loader.js|public/tawk-native-force.js|public/images/tawk-fox-face-transparent.png) ;;
              *)
                echo "Blocked unexpected production path: $path"
                exit 6
                ;;
            esac
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Production files approved for sync"
            printf -- '- `%s`\n' "${changed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build production before push
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          else
            npm install
            npm run build
          fi

      - name: Commit tested Tawk sync
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDFOX Tawk Deploy Agent"
          git config user.email "wdfox-tawk-agent@users.noreply.github.com"
          git add public/tawk-language-loader.js public/tawk-native-force.js public/images/tawk-fox-face-transparent.png
          git commit -m "Sync tested Tawk preview to production" -m "Source preview: $source_sha"

      - name: Push production
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          NEW_SHA=$(git rev-parse HEAD)
          {
            echo "### Production updated"
            echo "- Source preview: \`$source_sha\`"
            echo "- New production SHA: \`$NEW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Agent result"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Final job status is shown by GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"
