name: WDFOX Tawk Deploy Agent

on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect or sync"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - sync
      source_branch:
        description: "Source branch"
        required: true
        default: "preview"
      target_branch:
        description: "Target branch"
        required: true
        default: "main"
      approved_preview_commit:
        description: "Exact approved PREVIEW commit SHA"
        required: true
      confirm:
        description: "For production sync enter DEPLOY_TAWK_TO_MAIN"
        required: false
        default: ""
      qa_review:
        description: "Independent 20.3 Review verdict"
        required: false
        default: ""
      approved_by_user:
        description: "Explicit user approval"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [wdfox_tawk_agent]

permissions:
  contents: write
  actions: write

env:
  DEFAULT_SOURCE: preview
  DEFAULT_TARGET: main

concurrency:
  group: wdfox-tawk-production
  cancel-in-progress: false

jobs:
  agent:
    name: WDFOX Tawk Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_ACTION: ${{ inputs.action }}
          WD_SOURCE: ${{ inputs.source_branch }}
          WD_TARGET: ${{ inputs.target_branch }}
          WD_APPROVED: ${{ inputs.approved_preview_commit }}
          WD_CONFIRM: ${{ inputs.confirm }}
          WD_QA_REVIEW: ${{ inputs.qa_review }}
          WD_APPROVED_BY_USER: ${{ inputs.approved_by_user }}
          RD_ACTION: ${{ github.event.client_payload.action }}
          RD_SOURCE: ${{ github.event.client_payload.source_branch }}
          RD_TARGET: ${{ github.event.client_payload.target_branch }}
          RD_APPROVED: ${{ github.event.client_payload.approved_preview_commit }}
          RD_CONFIRM: ${{ github.event.client_payload.confirm }}
          RD_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          RD_QA_REVIEW: ${{ github.event.client_payload.qa_review }}
          RD_APPROVED_BY_USER: ${{ github.event.client_payload.approved_by_user }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            ACTION="${RD_ACTION:-inspect}"
            SOURCE="${RD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${RD_TARGET:-$DEFAULT_TARGET}"
            APPROVED="${RD_APPROVED:-}"
            CONFIRM="${RD_CONFIRM:-}"
            REQUEST_ID="${RD_REQUEST_ID:-n8n}"
            QA_REVIEW="${RD_QA_REVIEW:-}"
            APPROVED_BY_USER="${RD_APPROVED_BY_USER:-false}"
          else
            ACTION="${WD_ACTION:-inspect}"
            SOURCE="${WD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${WD_TARGET:-$DEFAULT_TARGET}"
            APPROVED="${WD_APPROVED:-}"
            CONFIRM="${WD_CONFIRM:-}"
            REQUEST_ID="manual"
            QA_REVIEW="${WD_QA_REVIEW:-}"
            APPROVED_BY_USER="${WD_APPROVED_BY_USER:-false}"
          fi

          [[ "$ACTION" == "inspect" || "$ACTION" == "sync" ]] || { echo "Unsupported action: $ACTION"; exit 2; }
          [[ "$SOURCE" == "preview" ]] || { echo "Only source_branch=preview is allowed"; exit 2; }
          [[ "$TARGET" == "main" ]] || { echo "Only target_branch=main is allowed"; exit 2; }
          [[ "$APPROVED" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "approved_preview_commit must be an exact 40-char SHA"; exit 2; }

          if [[ "$ACTION" == "sync" ]]; then
            [[ "$QA_REVIEW" == "PASS" ]] || { echo "Blocked: 20.3 independent Review PASS required"; exit 7; }
            [[ "$APPROVED_BY_USER" == "true" ]] || { echo "Blocked: explicit user approval required"; exit 7; }
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "qa_review=$QA_REVIEW" >> "$GITHUB_OUTPUT"
          echo "approved_by_user=$APPROVED_BY_USER" >> "$GITHUB_OUTPUT"

      - name: Checkout WDFOX production
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.target }}
          fetch-depth: 0

      - name: Fetch and pin tested WDFOX preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.request.outputs.source }}:refs/remotes/origin/${{ steps.request.outputs.source }}"
          source_sha="$(git rev-parse 'origin/${{ steps.request.outputs.source }}')"
          target_sha="$(git rev-parse '${{ steps.request.outputs.target }}')"
          approved="${{ steps.request.outputs.approved }}"
          [[ "$source_sha" == "$approved" ]] || {
            echo "PREVIEW head moved. approved=$approved current=$source_sha"
            exit 3
          }
          echo "source_sha=$source_sha" >> "$GITHUB_ENV"
          echo "target_sha=$target_sha" >> "$GITHUB_ENV"

      - name: Stage complete tested Tawk PREVIEW frontend package
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/wdfox-tawk-source
          rm -rf "$SRC"
          mkdir -p "$SRC"
          git show "$source_sha:public/tawk-preview-external.js" > "$SRC/tawk-preview-external.js"
          git show "$source_sha:public/tawk-preview-launcher.js" > "$SRC/tawk-preview-launcher.js"
          git show "$source_sha:public/tawk-preview-avatar-fix.js" > "$SRC/tawk-preview-avatar-fix.js"
          git show "$source_sha:public/images/tawk-fox-face-transparent.png" > "$SRC/tawk-fox-face-transparent.png"

      - name: Generate production package from approved PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/wdfox-tawk-sync
          rm -rf "$OUT"
          python3 .github/scripts/wdfox_tawk_sync.py --input-dir /tmp/wdfox-tawk-source --output-dir "$OUT"

      - name: Validate generated production package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          test -s "$ROOT/tawk-language-loader.js"
          test -s "$ROOT/tawk-native-force.js"
          test -s "$ROOT/tawk-avatar-fix.js"
          file "$ROOT/tawk-fox-face-transparent.png" | grep -qi 'PNG image data'
          grep -q 'Tawk_API.endChat' "$ROOT/tawk-language-loader.js"
          if grep -F -q '#fixed-lang-layer a.language-flag[data-language]' "$ROOT/tawk-language-loader.js"; then
            echo "Duplicate language-click handler detected"
            exit 4
          fi
          if grep -q 'Tawk_API.switchWidget' "$ROOT/tawk-language-loader.js"; then
            echo "Same-session widget switching detected"
            exit 4
          fi

      - name: Inspect preview-to-production package
        if: steps.request.outputs.action == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          for pair in \
            "public/tawk-language-loader.js:$ROOT/tawk-language-loader.js" \
            "public/tawk-native-force.js:$ROOT/tawk-native-force.js" \
            "public/tawk-avatar-fix.js:$ROOT/tawk-avatar-fix.js" \
            "public/images/tawk-fox-face-transparent.png:$ROOT/tawk-fox-face-transparent.png"; do
            current="${pair%%:*}"
            candidate="${pair#*:}"
            if [[ -f "$current" ]] && cmp -s "$current" "$candidate"; then
              echo "$current already matches approved PREVIEW" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$current would be updated from approved PREVIEW" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Validate production sync confirmation
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.request.outputs.confirm }}" == "DEPLOY_TAWK_TO_MAIN" ]] || {
            echo "Production confirmation missing. Expected DEPLOY_TAWK_TO_MAIN"
            exit 5
          }
          [[ "${{ steps.request.outputs.qa_review }}" == "PASS" ]] || {
            echo "20.3 Review PASS missing"
            exit 7
          }
          [[ "${{ steps.request.outputs.approved_by_user }}" == "true" ]] || {
            echo "User approval missing"
            exit 7
          }

      - name: Apply approved PREVIEW frontend package
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          cp "$ROOT/tawk-language-loader.js" public/tawk-language-loader.js
          cp "$ROOT/tawk-native-force.js" public/tawk-native-force.js
          cp "$ROOT/tawk-avatar-fix.js" public/tawk-avatar-fix.js
          cp "$ROOT/tawk-fox-face-transparent.png" public/images/tawk-fox-face-transparent.png

      - name: Enforce approved Tawk-only production scope
        if: steps.request.outputs.action == 'sync'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              public/tawk-language-loader.js|public/tawk-native-force.js|public/tawk-avatar-fix.js|public/images/tawk-fox-face-transparent.png) ;;
              *) echo "Blocked unexpected production path: $path"; exit 6 ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build WDFOX production before push
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          else
            npm install
            npm run build
          fi

      - name: Commit approved WDFOX Tawk package
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDFOX Tawk Deploy Agent"
          git config user.email "wdfox-tawk-agent@users.noreply.github.com"
          git add public/tawk-language-loader.js public/tawk-native-force.js public/tawk-avatar-fix.js public/images/tawk-fox-face-transparent.png
          git commit -m "Promote QA-approved WDFOX Tawk PREVIEW package to production" -m "Source preview: $source_sha" -m "20.3 Review: PASS"

      - name: Push WDFOX Tawk production
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Production updated to $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger GitHub Pages deployment explicitly
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Explicit deploy.yml workflow_dispatch sent" >> "$GITHUB_STEP_SUMMARY"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "Approved PREVIEW: ${{ steps.request.outputs.approved }}" >> "$GITHUB_STEP_SUMMARY"
          echo "20.3 Review: ${{ steps.request.outputs.qa_review }}" >> "$GITHUB_STEP_SUMMARY"
          echo "User approval: ${{ steps.request.outputs.approved_by_user }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
