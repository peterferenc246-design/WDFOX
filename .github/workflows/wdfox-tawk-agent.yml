name: WDFOX Tawk Deploy Agent

on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect or sync"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - sync
      source_branch:
        description: "Source branch"
        required: true
        default: "preview"
      target_branch:
        description: "Target branch"
        required: true
        default: "main"
      confirm:
        description: "For production sync enter DEPLOY_TAWK_TO_MAIN"
        required: false
        default: ""
  repository_dispatch:
    types: [wdfox_tawk_agent]

permissions:
  contents: write

env:
  DEFAULT_SOURCE: preview
  DEFAULT_TARGET: main

concurrency:
  group: wdfox-tawk-production
  cancel-in-progress: false

jobs:
  agent:
    name: WDFOX Tawk Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_ACTION: ${{ inputs.action }}
          WD_SOURCE: ${{ inputs.source_branch }}
          WD_TARGET: ${{ inputs.target_branch }}
          WD_CONFIRM: ${{ inputs.confirm }}
          RD_ACTION: ${{ github.event.client_payload.action }}
          RD_SOURCE: ${{ github.event.client_payload.source_branch }}
          RD_TARGET: ${{ github.event.client_payload.target_branch }}
          RD_CONFIRM: ${{ github.event.client_payload.confirm }}
          RD_REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            ACTION="${RD_ACTION:-inspect}"
            SOURCE="${RD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${RD_TARGET:-$DEFAULT_TARGET}"
            CONFIRM="${RD_CONFIRM:-}"
            REQUEST_ID="${RD_REQUEST_ID:-n8n}"
          else
            ACTION="${WD_ACTION:-inspect}"
            SOURCE="${WD_SOURCE:-$DEFAULT_SOURCE}"
            TARGET="${WD_TARGET:-$DEFAULT_TARGET}"
            CONFIRM="${WD_CONFIRM:-}"
            REQUEST_ID="manual"
          fi

          [[ "$ACTION" == "inspect" || "$ACTION" == "sync" ]] || { echo "Unsupported action: $ACTION"; exit 2; }
          [[ "$SOURCE" == "preview" ]] || { echo "Only source_branch=preview is allowed"; exit 2; }
          [[ "$TARGET" == "main" ]] || { echo "Only target_branch=main is allowed"; exit 2; }

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout WDFOX production
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.target }}
          fetch-depth: 0

      - name: Fetch tested WDFOX preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.request.outputs.source }}:refs/remotes/origin/${{ steps.request.outputs.source }}"
          echo "source_sha=$(git rev-parse 'origin/${{ steps.request.outputs.source }}')" >> "$GITHUB_ENV"
          echo "target_sha=$(git rev-parse '${{ steps.request.outputs.target }}')" >> "$GITHUB_ENV"

      - name: Stage tested Tawk preview files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/wdfox-tawk-source
          rm -rf "$SRC"
          mkdir -p "$SRC"
          git show "origin/${{ steps.request.outputs.source }}:public/tawk-preview-external.js" > "$SRC/tawk-preview-external.js"
          git show "origin/${{ steps.request.outputs.source }}:public/tawk-preview-launcher.js" > "$SRC/tawk-preview-launcher.js"
          git show "origin/${{ steps.request.outputs.source }}:public/images/tawk-fox-face-transparent.png" > "$SRC/tawk-fox-face-transparent.png"

      - name: Generate isolated WDFOX Tawk production candidates
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/wdfox-tawk-sync
          rm -rf "$OUT"
          python3 .github/scripts/wdfox_tawk_sync.py --input-dir /tmp/wdfox-tawk-source --output-dir "$OUT"

      - name: Validate generated WDFOX Tawk candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          test -s "$ROOT/tawk-language-loader.js"
          test -s "$ROOT/tawk-native-force.js"
          file "$ROOT/tawk-fox-face-transparent.png" | grep -qi 'PNG image data'

      - name: Inspect preview-to-production sync
        if: steps.request.outputs.action == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          for pair in \
            "public/tawk-language-loader.js:$ROOT/tawk-language-loader.js" \
            "public/tawk-native-force.js:$ROOT/tawk-native-force.js" \
            "public/images/tawk-fox-face-transparent.png:$ROOT/tawk-fox-face-transparent.png"; do
            current="${pair%%:*}"
            candidate="${pair#*:}"
            if cmp -s "$current" "$candidate"; then
              echo "$current already matches" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$current would be updated" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Validate production sync confirmation
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.request.outputs.confirm }}" == "DEPLOY_TAWK_TO_MAIN" ]] || {
            echo "Production confirmation missing. Expected DEPLOY_TAWK_TO_MAIN"
            exit 5
          }

      - name: Apply generated WDFOX Tawk candidates
        if: steps.request.outputs.action == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wdfox-tawk-sync
          cp "$ROOT/tawk-language-loader.js" public/tawk-language-loader.js
          cp "$ROOT/tawk-native-force.js" public/tawk-native-force.js
          cp "$ROOT/tawk-fox-face-transparent.png" public/images/tawk-fox-face-transparent.png

      - name: Enforce WDFOX Tawk-only production scope
        if: steps.request.outputs.action == 'sync'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              public/tawk-language-loader.js|public/tawk-native-force.js|public/images/tawk-fox-face-transparent.png) ;;
              *)
                echo "Blocked unexpected production path: $path"
                exit 6
                ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build WDFOX production before push
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          else
            npm install
            npm run build
          fi

      - name: Commit tested WDFOX Tawk sync
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDFOX Tawk Deploy Agent"
          git config user.email "wdfox-tawk-agent@users.noreply.github.com"
          git add public/tawk-language-loader.js public/tawk-native-force.js public/images/tawk-fox-face-transparent.png
          git commit -m "Sync tested WDFOX Tawk preview to production" -m "Source preview: $source_sha"

      - name: Push WDFOX Tawk production
        if: steps.request.outputs.action == 'sync' && steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Production updated to $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
