name: FOX Agent policy check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  fox-agent-policy:
    if: startsWith(github.event.pull_request.title, '[FOX Agent]')
    runs-on: ubuntu-latest
    steps:
      - name: Enforce FOX Agent source branch
        shell: bash
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "Head branch: ${{ github.head_ref }}"
          echo "Base branch: ${{ github.base_ref }}"

          if [ "${{ github.head_ref }}" != "TEST" ]; then
            echo "FOX Agent PRs must originate from TEST."
            exit 1
          fi

          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "FOX Agent PRs must target main."
            exit 1
          fi

          echo "FOX Agent branch policy OK."
