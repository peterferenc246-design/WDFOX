name: Apply requested contact and Tawk button repair
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/Landing.astro')
          t=p.read_text(encoding='utf-8')
          # Preserve the morning contact layout: photo + map, contact details, address and social links.
          if 'class="register-address"' not in t:
              raise SystemExit('Requested morning contact address is missing; refusing to alter unrelated markup')
          if 'class="contact-socials"' not in t:
              raise SystemExit('Requested social links are missing; refusing to alter unrelated markup')
          p.write_text(t,encoding='utf-8')
          css=Path('src/styles/site.css')
          s=css.read_text(encoding='utf-8')
          marker='/* WDFOX requested Tawk image button */'
          if marker not in s:
              s += '''\n\n/* WDFOX requested Tawk image button */\n#fox-tawk-button{background:transparent!important;}\n#fox-tawk-button .fox-tawk-attention{background:transparent!important;box-shadow:none!important;border:0!important;}\n#fox-tawk-button .fox-tawk-attention > *{display:none!important;}\n#fox-tawk-button .fox-tawk-attention::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;background-image:url("https://webdizain-bbyygbqm.manus.space/manus-storage/webdizainfox-fox-hero_22939d0f.png")!important;background-repeat:no-repeat!important;background-position:center!important;background-size:contain!important;transform:none!important;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22))!important;}\n'''
          css.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Landing.astro src/styles/site.css .github/workflows/repair-now.yml
          git rm .github/workflows/repair-now.yml
          git diff --cached --check
          git commit -m 'Restore morning contact block and Tawk image button'
          git push
          gh workflow run deploy.yml --ref main
          gh run list --workflow deploy.yml --branch main --limit 1 --json databaseId,status,conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
