name: Apply Jobcenter health message patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-jobcenter-health-message.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/add_jobcenter_health_message.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobcenter-poster-fix.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish 05.10.2026 Jobcenter health insurance message"
            git push
          fi
